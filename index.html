function mmLoad(){let d=null;try{d=JSON.parse(localStorage.getItem('figureassist.mindmap.v1'));}catch(e){}mm=mmNorm(d&&d.root?d:MM_EXAMPLES.research());}
function mmSer(){return JSON.stringify(mm,(k,v)=>k[0]==='_'?undefined:v);}
function mmPersist(){try{localStorage.setItem('figureassist.mindmap.v1',mmSer());}catch(e){}}
function mmWalk(t,fn,p=null,d=0){fn(t,p,d);for(const c of t.children)mmWalk(c,fn,t,d+1);}
function mmFind(id){let r=null;mmWalk(mm.root,t=>{if(t.id===id)r=t;});return r;}
function mmParentOf(id){let r=null;mmWalk(mm.root,(t,p)=>{if(t.id===id)r=p;});return r;}
function mmContains(t,id){let f=false;mmWalk(t,x=>{if(x.id===id)f=true;});return f;}

/* layout */
// 유기적 마인드맵(토니 부잔식): 주제는 기본적으로 '글씨 + 밑줄'이고, 밑줄이 곧 가지가 되어 다음 주제로 이어진다.
// 주제마다 모양(상자·타원·원·그림자 상자)으로 바꿀 수 있고, 그림을 붙일 수 있다.
const mmCtx=document.createElement('canvas').getContext('2d');
const mmFamily=()=>(FONTS.find(f=>f.id===mm.font)||FONTS[0]).family;
const MM_SHAPES=[['text','글씨'],['box','상자'],['ellipse','타원'],['circle','원'],['shadow','그림자']];
function mmShapeOf(t,d){return t.shape||(d===0?'ellipse':mm.shape||'text');}
function mmMeasure(t,d){const fs=t.fs||(d===0?30:d===1?24:d===2?17:14),bold=t.bold!=null?t.bold:d===2,sh=mmShapeOf(t,d);mmCtx.font=`${bold?'bold ':''}${fs}px ${mmFamily()}`;
  const lines=(t.text||'').split('\n'),hasText=!!(t.text||'').trim(),tw=hasText?Math.max(...lines.map(l=>mmCtx.measureText(l||' ').width)):0,th=hasText?lines.length*fs*1.25:0;
  const iw=t.img?t.img.w:0,ih=t.img?t.img.h:0,gap=iw&&hasText?8:0,cw=Math.max(iw+gap+tw,8),ch=Math.max(ih,th,fs*.6);let w,h;
  if(sh==='text'){w=cw+8;h=ch+8;}else if(sh==='box'||sh==='shadow'){w=cw+28;h=ch+18;}else{w=(cw+(d===0?44:24))*1.22;h=(ch+(d===0?30:16))*1.42;if(sh==='circle')w=h=Math.max(w,h);}
  return {w:Math.ceil(w),h:Math.ceil(h),fs,bold,lines,hasText,tw,th,iw,ih,gap,cw,ch,shape:sh};}
function mmSub(t,d){t._m=mmMeasure(t,d);if(t.collapsed||!t.children.length)return t._sh=t._m.h;const g=d===1?10:4;const s=t.children.reduce((a,c)=>a+mmSub(c,d+1),0)+g*(t.children.length-1);return t._sh=Math.max(t._m.h,s);}
function mmColorAt(i){return mm.theme==='mono'?'#4A5361':MM_COLORS[(i||0)%MM_COLORS.length];}
function mmAnchor(L){const s=L.side||1;L.ay=L.shape==='text'?L.y+L.h:L.cy;L.ix=s>0?L.x:L.x+L.w;L.ox=s>0?L.x+L.w:L.x;return L;}
function mmPlace(t,d,s,edge,cy,pid,col){const m=t._m,c=t.color||col;const x=s>0?edge:edge-m.w;const L=mmAnchor(Object.assign({t,depth:d,side:s,x,y:cy-m.h/2,cx:x+m.w/2,cy,parent:pid,color:c},m));mmLay.set(t.id,L);
  if(t.collapsed||!t.children.length)return;const g=d===1?10:4;const tot=t.children.reduce((a,k)=>a+k._sh,0)+g*(t.children.length-1);let y=cy-tot/2;const H=d===1?42:30;
  for(const k of t.children){mmPlace(k,d+1,s,s>0?L.ox+H:L.ox-H,y+k._sh/2,t.id,c);y+=k._sh+g;}}
function mmLayout(){mmLay=new Map();const R=mm.root;mmSub(R,0);const m=R._m;mmLay.set(R.id,mmAnchor(Object.assign({t:R,depth:0,side:0,x:-m.w/2,y:-m.h/2,cx:0,cy:0,parent:null,color:'#333333'},m)));if(R.collapsed)return;
  const kids=R.children,right=mm.layout==='right'?kids:kids.filter(c=>c.side!=='L'),left=mm.layout==='right'?[]:kids.filter(c=>c.side==='L');
  for(const [arr,s] of [[right,1],[left,-1]]){const g=26;const tot=arr.reduce((a,c)=>a+c._sh,0)+g*Math.max(0,arr.length-1);let y=-tot/2;for(const c of arr){mmPlace(c,1,s,s*(m.w/2+70),y+c._sh/2,R.id,mmColorAt(c.ci));y+=c._sh+g;}}}

/* rendering */
// 가지: 부모 끝 → 자식 시작까지 곡선, 자식이 '글씨'면 글씨 밑으로 밑줄이 이어진다. 깊이에 따라 굵기가 줄어드는 리본으로 그린다.
function mmBranch(P,C){const s=C.side,d=C.depth;let x0,y0;
  if(P.depth===0){const rx=P.w/2,ry=P.h/2,a=Math.atan2((C.ay-P.cy)/ry,s);x0=P.cx+Math.cos(a)*rx*.86;y0=P.cy+Math.sin(a)*ry*.86;}else{x0=P.ox;y0=P.ay;}
  const x1=C.ix,y1=C.ay,k=Math.max(14,Math.abs(x1-x0)*.5),W=d===1?[11,5.5]:d===2?[4.4,2.8]:d===3?[2.4,1.7]:[1.6,1.2];
  const B=t=>{const u=1-t;return [u*u*u*x0+3*u*u*t*(x0+s*k)+3*u*t*t*(x1-s*k)+t*t*t*x1,u*u*u*y0+3*u*u*t*y0+3*u*t*t*y1+t*t*t*y1];};
  const pts=[];for(let i=0;i<=20;i++){const t=i/20;pts.push([...B(t),W[0]+(W[1]-W[0])*Math.pow(t,.8)]);}
  if(C.shape==='text'){pts.push([C.ox,y1,W[1]*.75]);}
  const a=[],b=[];pts.forEach((p,i)=>{const q=pts[Math.min(pts.length-1,i+1)],r=pts[Math.max(0,i-1)];const dx=q[0]-r[0],dy=q[1]-r[1],l=Math.hypot(dx,dy)||1,w=p[2]/2;a.push(`${R(p[0]-dy/l*w)} ${R(p[1]+dx/l*w)}`);b.push(`${R(p[0]+dy/l*w)} ${R(p[1]-dx/l*w)}`);});
  const g=svgEl('g');g.appendChild(svgEl('path',{d:'M'+a.join(' L')+' L'+b.reverse().join(' L')+'Z',fill:C.color}));const e=pts[pts.length-1];g.appendChild(svgEl('circle',{cx:R(e[0]),cy:R(e[1]),r:R(e[2]/2),fill:C.color}));return g;}
function mmNodeEl(L){const g=svgEl('g',{'data-mid':L.t.id,class:'mm-node'+(mmSel.has(L.t.id)?' sel':'')});const d=L.depth,t=L.t,sh=L.shape,col=L.color;
  const ink=d===0?'#3A3A3A':d===1?col:'#1D2754';
  if(sh==='text')g.appendChild(svgEl('rect',{x:R(L.x),y:R(L.y),width:R(L.w),height:R(L.h),fill:'transparent'}));
  else{const base=d===0?{fill:t.color?mixWhite(t.color,.55):'#FFE08A',stroke:'#333333','stroke-width':5}:{fill:mixWhite(col,.86),stroke:col,'stroke-width':1.6};
    if(sh==='shadow')g.appendChild(svgEl('rect',{x:R(L.x+6),y:R(L.y+6),width:R(L.w),height:R(L.h),rx:2,fill:mixWhite(col,.45)}));
    if(sh==='box'||sh==='shadow')g.appendChild(svgEl('rect',Object.assign({x:R(L.x),y:R(L.y),width:R(L.w),height:R(L.h),rx:sh==='box'?8:2},base,sh==='shadow'?{fill:'#FFFFFF'}:{})));
    else g.appendChild(svgEl('ellipse',Object.assign({cx:R(L.cx),cy:R(L.cy),rx:R(L.w/2),ry:R(L.h/2)},base)));}
  // 내용(그림 + 글씨)은 가운데 정렬. 글씨 모양이면 밑줄 바로 위에 앉힌다.
  const cy=sh==='text'?L.y+L.h-4-L.ch/2:L.cy,x0=L.cx-L.cw/2;
  if(t.img)g.appendChild(svgEl('image',{href:t.img.src,x:R(x0),y:R(cy-L.ih/2),width:R(L.iw),height:R(L.ih),preserveAspectRatio:'xMidYMid meet'}));
  if(L.hasText){const lh=L.fs*1.25,n=L.lines.length,tx=svgEl('text',{'font-family':mmFamily(),'font-size':L.fs,'font-weight':L.bold?'bold':'normal',fill:ink,'text-anchor':'middle'}),tcx=x0+L.iw+L.gap+L.tw/2;
    L.lines.forEach((ln,i)=>tx.appendChild(svgEl('tspan',{x:R(tcx),y:R(cy-(n-1)/2*lh+i*lh+L.fs*.35)},[ln||' '])));g.appendChild(tx);}
  if(d>0&&t.children.length){const ox=L.ox+L.side*10,oy=L.ay;const tg=svgEl('g',{class:'mm-tog'+(t.collapsed?'':' exp'),'data-mm-tog':t.id});
    tg.appendChild(svgEl('circle',{cx:R(ox),cy:R(oy),r:8,fill:t.collapsed?col:'#FFFFFF',stroke:col,'stroke-width':1.4}));
    if(t.collapsed){let n2=0;mmWalk(t,()=>n2++);tg.appendChild(svgEl('text',{x:R(ox),y:R(oy+3.2),'font-size':9,'font-family':'Arial, sans-serif','font-weight':'bold',fill:'#FFFFFF','text-anchor':'middle'},[String(n2-1)]));}
    else tg.appendChild(svgEl('path',{d:`M${R(ox-4)} ${R(oy)}h8`,stroke:col,'stroke-width':1.6}));g.appendChild(tg);}
  return g;}
function mmRender(){mmLayout();gMM.textContent='';const br=svgEl('g'),nd=svgEl('g');gMM.append(br,nd);for(const L of mmLay.values()){if(L.parent)br.appendChild(mmBranch(mmLay.get(L.parent),L));nd.appendChild(mmNodeEl(L));}mmRenderOverlay();mmStatus();}
function mmRenderOverlay(){gMMov.textContent='';const z=mmView.zoom,acc='var(--accent)';
  for(const id of mmSel){const L=mmLay.get(id);if(L)gMMov.appendChild(svgEl('rect',{x:L.x-4,y:L.y-4,width:L.w+8,height:L.h+8,rx:(L.depth===0?L.h/2:8)+4,fill:'none',stroke:acc,'stroke-width':2/z,'pointer-events':'none'}));}
  const D=mmDrag;if(D&&D.mode==='node'&&D.moved){const L=mmLay.get(D.id);
    if(D.target){const T=mmLay.get(D.target);gMMov.appendChild(svgEl('rect',{x:T.x-5,y:T.y-5,width:T.w+10,height:T.h+10,rx:10,fill:acc,'fill-opacity':.12,stroke:acc,'stroke-width':2/z,'stroke-dasharray':`${5/z} ${3/z}`,'pointer-events':'none'}));}
    const gh=svgEl('g',{opacity:.6,'pointer-events':'none'});gh.appendChild(svgEl('rect',{x:D.cur.x-L.w/2,y:D.cur.y-L.h/2,width:L.w,height:L.h,rx:8,fill:L.depth<=1?L.color:mixWhite(L.color,.8),stroke:acc,'stroke-width':1.5/z}));
    gh.appendChild(svgEl('text',{x:D.cur.x,y:D.cur.y+L.fs*.36,'text-anchor':'middle','font-size':L.fs,'font-family':mmFamily(),fill:L.depth<=1?'#fff':'#1A1A1A'},[L.lines[0]||'']));gMMov.appendChild(gh);}}
function mmStatus(){if(mode!=='mindmap')return;let n=0;mmWalk(mm.root,()=>n++);$('#st-sel').textContent=(mmSel.size?L('{n}개 선택',{n:mmSel.size})+' · ':'')+L('주제 {n}개',{n});$('#zoom-label').textContent=Math.round(mmView.zoom*100)+'%';}
function mmUndoBtns(){$('#btn-undo').disabled=!mmHist.length;$('#btn-redo').disabled=!mmFut.length;}

/* view */
function mmApplyView(){const r=mmStage.getBoundingClientRect();if(r.width<1||r.height<1)return;mmSvg.setAttribute('viewBox',`${mmView.x} ${mmView.y} ${r.width/mmView.zoom} ${r.height/mmView.zoom}`);mmRenderOverlay();mmStatus();}
function mmBBox(){let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;for(const L of mmLay.values()){x1=Math.min(x1,L.x-20);y1=Math.min(y1,L.y);x2=Math.max(x2,L.x+L.w+20);y2=Math.max(y2,L.y+L.h);}return {x:x1,y:y1,w:x2-x1,h:y2-y1};}
function mmFit(){const r=mmStage.getBoundingClientRect();if(r.width<80||r.height<80){requestAnimationFrame(mmFit);return;}mmLayout();const b=mmBBox();const z=clamp(Math.min((r.width-80)/b.w,(r.height-80)/b.h,1.3),.15,3);mmView.zoom=z;mmView.x=b.x+b.w/2-r.width/z/2;mmView.y=b.y+b.h/2-r.height/z/2;mmFitted=true;mmApplyView();}
function mmZoomAt(f,cx,cy){const r=mmStage.getBoundingClientRect();const nz=clamp(mmView.zoom*f,.15,5);const px=cx==null?r.width/2:cx,py=cy==null?r.height/2:cy;const wx=mmView.x+px/mmView.zoom,wy=mmView.y+py/mmView.zoom;mmView.zoom=nz;mmView.x=wx-px/nz;mmView.y=wy-py/nz;mmApplyView();if(mmEdit)mmPlaceEditor();}
function mmToWorld(ev){const r=mmStage.getBoundingClientRect();return {x:mmView.x+(ev.clientX-r.left)/mmView.zoom,y:mmView.y+(ev.clientY-r.top)/mmView.zoom};}
function mmEnsureVisible(id){const L=mmLay.get(id);if(!L)return;const r=mmStage.getBoundingClientRect(),z=mmView.zoom,m=40/z;const vw=r.width/z,vh=r.height/z;let {x,y}=mmView;
  if(L.x-m<x)x=L.x-m;else if(L.x+L.w+m>x+vw)x=L.x+L.w+m-vw;if(L.y-m<y)y=L.y-m;else if(L.y+L.h+m>y+vh)y=L.y+L.h+m-vh;if(x!==mmView.x||y!==mmView.y){mmView.x=x;mmView.y=y;mmApplyView();}}

/* history */
function mmSnap(){mmHist.push(mmSer());if(mmHist.length>100)mmHist.shift();mmFut=[];}
function mmChanged(){mmPersist();mmRender();mmRenderInsp();mmUndoBtns();}
function mmMutate(fn){mmSnap();fn();mmChanged();}
function mmUndo(){if(!mmHist.length)return;mmFut.push(mmSer());mm=JSON.parse(mmHist.pop());mmSel=new Set([...mmSel].filter(id=>mmFind(id)));mmChanged();}
function mmRedo(){if(!mmFut.length)return;mmHist.push(mmSer());mm=JSON.parse(mmFut.pop());mmSel=new Set([...mmSel].filter(id=>mmFind(id)));mmChanged();}

/* editing */
function mmPlaceEditor(){const E=mmEdit;if(!E)return;const L=mmLay.get(E.id);if(!L)return;const r=mmStage.getBoundingClientRect(),z=mmView.zoom;
  Object.assign(E.ed.style,{left:(L.x-mmView.x)*z+'px',top:(L.y-mmView.y)*z+'px',minWidth:Math.max(L.w*z,80)+'px',minHeight:L.h*z+'px',fontSize:L.fs*z+'px',fontWeight:L.bold?'bold':'normal',fontFamily:mmFamily(),padding:`${6*z}px ${10*z}px`});}
function mmStartEdit(id,replace){mmCommit();const L=mmLay.get(id);if(!L)return;const ed=document.createElement('div');ed.className='edit-box mm-edit';ed.contentEditable='true';ed.innerText=replace?'':L.t.text;
  mmStage.appendChild(ed);mmEdit={id,ed};mmPlaceEditor();ed.focus();if(!replace){const g=getSelection(),rg=document.createRange();rg.selectNodeContents(ed);g.removeAllRanges();g.addRange(rg);}
  ed.addEventListener('keydown',e=>{e.stopPropagation();if(e.isComposing||e.keyCode===229)return;
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();mmCommit();}
    else if(e.key==='Enter'){e.preventDefault();if(!document.execCommand('insertLineBreak'))document.execCommand('insertText',false,'\n');}
    else if(e.key==='Tab'){e.preventDefault();mmCommit();mmAddChild(id);}
    else if(e.key==='Escape'){e.preventDefault();mmCancelEdit();}});
  ed.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain')||'');});
  ed.addEventListener('blur',()=>setTimeout(()=>{if(mmEdit&&mmEdit.ed===ed)mmCommit();},0));}
function mmCancelEdit(){if(!mmEdit)return;mmEdit.ed.remove();mmEdit=null;}
function mmCommit(){if(!mmEdit)return;const {id,ed}=mmEdit;mmEdit=null;const v=ed.innerText.replace(/\s+$/,'');ed.remove();const t=mmFind(id);if(t&&v&&v!==t.text)mmMutate(()=>{t.text=v;});}

/* actions */
function mmPick(){return [...mmSel].filter(id=>mmFind(id));}
function mmSideFor(){let r=0,l=0;for(const c of mm.root.children){const n=(()=>{let k=0;mmWalk(c,()=>k++);return k;})();c.side==='L'?l+=n:r+=n;}return r<=l?'R':'L';}
function mmAddChild(pid){const p=mmFind(pid||mm.root.id)||mm.root;const isRoot=p===mm.root;const t=mmTopic(isRoot?TL('주요 주제','Main topic'):TL('하위 주제','Subtopic'));
  mmMutate(()=>{if(isRoot){t.side=mmSideFor();t.ci=mmNextCi();}p.collapsed=false;p.children.push(t);});mmSel=new Set([t.id]);mmRender();mmEnsureVisible(t.id);mmStartEdit(t.id);}
function mmAddSibling(id){const p=mmParentOf(id);if(!p){mmAddChild(mm.root.id);return;}const cur=mmFind(id);const t=mmTopic(p===mm.root?TL('주요 주제','Main topic'):TL('하위 주제','Subtopic'));
  mmMutate(()=>{if(p===mm.root){t.side=cur.side;t.ci=mmNextCi();}p.children.splice(p.children.indexOf(cur)+1,0,t);});mmSel=new Set([t.id]);mmRender();mmEnsureVisible(t.id);mmStartEdit(t.id);}
function mmDelete(){const ids=mmPick().filter(id=>id!==mm.root.id);if(!ids.length)return;const p=mmParentOf(ids[0]);
  mmMutate(()=>{for(const id of ids){const q=mmParentOf(id);if(q)q.children=q.children.filter(c=>c.id!==id);}});mmSel=new Set(p&&mmFind(p.id)?[p.id]:[]);mmRenderOverlay();mmRenderInsp();mmStatus();}
function mmToggle(){const ids=mmPick().filter(id=>mmFind(id).children.length&&id!==mm.root.id);if(!ids.length)return;const to=!mmFind(ids[0]).collapsed;mmMutate(()=>ids.forEach(id=>mmFind(id).collapsed=to));}
function mmMoveSib(id,dir){const p=id&&mmParentOf(id);if(!p)return;const t=mmFind(id);const same=p.children.filter(c=>p!==mm.root||mm.layout==='right'||c.side===t.side);const i=same.indexOf(t),o=same[i+dir];if(!o)return;
  mmMutate(()=>{const a=p.children.indexOf(t),b=p.children.indexOf(o);p.children[a]=o;p.children[b]=t;});}
function mmTop(){const ids=mmPick();return ids.filter(id=>!ids.some(o=>o!==id&&mmContains(mmFind(o),id)));}
function mmFresh(t){const c=JSON.parse(JSON.stringify(t,(k,v)=>k[0]==='_'?undefined:v));mmWalk(c,x=>{x.id=mmUid();});return c;}
function mmCopy(){const ids=mmTop();if(!ids.length)return false;mmClip=ids.map(id=>mmFresh(mmFind(id)));toast(L('주제 {n}개를 복사했습니다',{n:ids.length}));return true;}
function mmPaste(){if(!mmClip)return false;const p=mmFind(mmPick()[0])||mm.root;const add=mmClip.map(mmFresh);
  mmMutate(()=>{p.collapsed=false;for(const c of add){if(p===mm.root){c.side=mmSideFor();c.ci=mmNextCi();}else{delete c.side;delete c.ci;}p.children.push(c);}});mmSel=new Set(add.map(c=>c.id));mmRender();mmEnsureVisible(add[0].id);return true;}
function mmDuplicate(){const ids=mmTop().filter(id=>id!==mm.root.id);if(!ids.length)return;const made=[];
  mmMutate(()=>{for(const id of ids){const p=mmParentOf(id),t=mmFind(id),c=mmFresh(t);if(p===mm.root)c.ci=mmNextCi();p.children.splice(p.children.indexOf(t)+1,0,c);made.push(c.id);}});mmSel=new Set(made);mmRender();}
function mmNav(k){const id=mmPick().pop()||mm.root.id;const L=mmLay.get(id);if(!L)return;const t=L.t;let nx=null;
  const kids=s=>(t.collapsed?[]:t.children).filter(c=>mmLay.get(c.id)&&mmLay.get(c.id).side===s).sort((a,b)=>Math.abs(mmLay.get(a.id).cy-L.cy)-Math.abs(mmLay.get(b.id).cy-L.cy));
  if(k==='arrowright')nx=(L.depth===0||L.side>0)?kids(1)[0]:mmLay.get(L.parent).t;
  else if(k==='arrowleft')nx=(L.depth===0||L.side<0)?kids(-1)[0]:mmLay.get(L.parent).t;
  else if(L.depth>0){const sib=mmLay.get(L.parent).t.children.filter(c=>mmLay.get(c.id)&&mmLay.get(c.id).side===L.side).sort((a,b)=>mmLay.get(a.id).cy-mmLay.get(b.id).cy);nx=sib[sib.indexOf(t)+(k==='arrowup'?-1:1)];}
  if(nx){mmSel=new Set([nx.id]);mmRenderOverlay();mmRenderInsp();mmStatus();mmEnsureVisible(nx.id);}}
function mmDrop(D,p){const t=mmFind(D.id),from=mmParentOf(D.id);if(!t||!from)return;
  if(D.target){const T=mmFind(D.target);mmMutate(()=>{from.children=from.children.filter(c=>c!==t);if(T===mm.root){t.side=p.x<0?'L':'R';t.ci=mmNextCi();}else{delete t.side;delete t.ci;}T.collapsed=false;T.children.push(t);});return;}
  // 빈 곳에 놓으면: 같은 부모 안에서 위아래 순서를 바꾸고, 1단계 주제는 왼쪽/오른쪽도 바꾼다
  const side=from===mm.root&&mm.layout!=='right'?(p.x<0?'L':'R'):null;
  mmMutate(()=>{from.children=from.children.filter(c=>c!==t);if(side)t.side=side;const same=from.children.filter(c=>!side||c.side===side).filter(c=>mmLay.get(c.id));
    const before=same.find(c=>mmLay.get(c.id).cy>p.y);if(before)from.children.splice(from.children.indexOf(before),0,t);else{const last=same[same.length-1];from.children.splice(last?from.children.indexOf(last)+1:from.children.length,0,t);}});}

/* pointer */
mmSvg.addEventListener('pointerdown',ev=>{if(ev.button!==0&&ev.button!==1)return;mmCommit();const p=mmToWorld(ev);
  const tg=ev.target.closest('[data-mm-tog]');if(tg&&ev.button===0){const t=mmFind(tg.dataset.mmTog);mmMutate(()=>{t.collapsed=!t.collapsed;});return;}
  const g=ev.button===0&&ev.target.closest('[data-mid]');
  if(g){const id=g.dataset.mid,now=performance.now();if(mmLast&&mmLast.id===id&&now-mmLast.t<450){mmLast=null;mmSel=new Set([id]);mmRenderOverlay();mmStartEdit(id);return;}mmLast={id,t:now};
    if(ev.ctrlKey||ev.metaKey||ev.shiftKey){mmSel.has(id)?mmSel.delete(id):mmSel.add(id);mmRenderOverlay();mmRenderInsp();mmStatus();return;}
    if(!mmSel.has(id))mmSel=new Set([id]);mmDrag={mode:'node',id,sp:p,cur:p,moved:false,target:null};mmSvg.setPointerCapture(ev.pointerId);mmRenderOverlay();mmRenderInsp();mmStatus();return;}
  if(!ev.ctrlKey&&!ev.shiftKey&&!ev.metaKey)mmSel.clear();mmDrag={mode:'pan',sx:ev.clientX,sy:ev.clientY,vx:mmView.x,vy:mmView.y};mmStage.classList.add('panning');mmSvg.setPointerCapture(ev.pointerId);mmRenderOverlay();mmRenderInsp();mmStatus();});
mmSvg.addEventListener('pointermove',ev=>{const D=mmDrag;if(!D)return;
  if(D.mode==='pan'){mmView.x=D.vx-(ev.clientX-D.sx)/mmView.zoom;mmView.y=D.vy-(ev.clientY-D.sy)/mmView.zoom;mmApplyView();return;}
  const p=mmToWorld(ev);if(!D.moved&&Math.hypot(p.x-D.sp.x,p.y-D.sp.y)*mmView.zoom<5)return;if(D.id===mm.root.id)return;D.moved=true;D.cur=p;mmStage.classList.add('moving');
  const el=document.elementFromPoint(ev.clientX,ev.clientY);const g=el&&el.closest&&el.closest('[data-mid]');const tid=g&&g.dataset.mid;D.target=tid&&!mmContains(mmFind(D.id),tid)&&tid!==(mmParentOf(D.id)||{}).id?tid:null;mmRenderOverlay();});
mmSvg.addEventListener('pointerup',ev=>{const D=mmDrag;mmDrag=null;mmStage.classList.remove('panning','moving');if(D&&D.mode==='node'&&D.moved)mmDrop(D,mmToWorld(ev));else mmRenderOverlay();});
mmStage.addEventListener('wheel',ev=>{ev.preventDefault();if(ev.ctrlKey||ev.metaKey){const r=mmStage.getBoundingClientRect();mmZoomAt(Math.exp(-ev.deltaY*.0015),ev.clientX-r.left,ev.clientY-r.top);}else{mmView.x+=ev.deltaX/mmView.zoom;mmView.y+=ev.deltaY/mmView.zoom;mmApplyView();if(mmEdit)mmPlaceEditor();}},{passive:false});

/* keyboard (워크플로우 단축키 처리기 맨 앞에서 호출) */
function mmKeydown(ev){if(mmEdit)return;const tag=(ev.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||ev.target.isContentEditable)return;
  const k=ev.key.toLowerCase(),mod=ev.ctrlKey||ev.metaKey,cur=mmPick().pop();
  if(mod&&k==='z'){ev.preventDefault();ev.shiftKey?mmRedo():mmUndo();return;}
  if(mod&&k==='y'){ev.preventDefault();mmRedo();return;}
  if(mod&&k==='a'){ev.preventDefault();mmSel=new Set();mmWalk(mm.root,t=>mmSel.add(t.id));mmRenderOverlay();mmRenderInsp();mmStatus();return;}
  if(mod&&(k==='c'||k==='x'||k==='v'))return; // copy·cut·paste 이벤트에서 처리(외부 그림·글 붙여넣기 포함)
  if(mod&&k==='d'){ev.preventDefault();mmDuplicate();return;}
  if(mod&&(k==='/'||ev.code==='Slash')){ev.preventDefault();mmToggle();return;}
  if(mod)return;
  if(k==='tab'){ev.preventDefault();mmAddChild(cur||mm.root.id);return;}
  if(k==='enter'){ev.preventDefault();cur?mmAddSibling(cur):mmAddChild(mm.root.id);return;}
  if(k==='delete'||k==='backspace'){ev.preventDefault();mmDelete();return;}
  if(k==='f2'||k===' '){if(cur){ev.preventDefault();mmStartEdit(cur);}return;}
  if(k==='escape'){mmSel.clear();mmRenderOverlay();mmRenderInsp();mmStatus();return;}
  if(ev.altKey&&(k==='arrowup'||k==='arrowdown')){ev.preventDefault();mmMoveSib(cur,k==='arrowup'?-1:1);return;}
  if(k.startsWith('arrow')){ev.preventDefault();mmNav(k);return;}
  if(cur&&mmSel.size===1&&!ev.altKey&&(ev.key.length===1||ev.key==='Process'))mmStartEdit(cur,true);}

/* images · clipboard */
// 그림은 긴 변 480px 이하로 줄여 dataURL로 문서 안에 저장한다(자동 저장·내보내기에 그대로 들어감). 화면 크기는 긴 변 110px로 시작한다.
function mmReadImage(file){return new Promise((ok,no)=>{const rd=new FileReader();rd.onerror=no;rd.onload=()=>{const img=new Image();img.onerror=no;img.onload=()=>{const k=Math.min(1,480/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);const png=/png|gif|svg|webp/.test(file.type);const src=c.toDataURL(png?'image/png':'image/jpeg',.88),r=110/Math.max(c.width,c.height);ok({src,w:Math.round(c.width*r),h:Math.round(c.height*r),nw:c.width,nh:c.height});};img.src=rd.result;};rd.readAsDataURL(file);});}
async function mmAddImage(file,targetId){let im;try{im=await mmReadImage(file);}catch(e){toast(L('그림을 읽을 수 없습니다'));return;}
  const t=targetId&&mmFind(targetId);if(t){mmMutate(()=>{t.img=im;});mmSel=new Set([t.id]);}
  else{const n=mmTopic('',[],{img:im});mmMutate(()=>{n.side=mmSideFor();n.ci=mmNextCi();mm.root.children.push(n);});mmSel=new Set([n.id]);}
  mmRender();mmRenderInsp();toast(L('그림을 넣었습니다'));}
function mmOutline(ts){const out=[];const w=(t,d)=>{out.push('\t'.repeat(d)+(t.text||'').replace(/\n/g,' '));t.children.forEach(c=>w(c,d+1));};ts.forEach(t=>w(t,0));return out.join('\n');}
let mmClipText='';
function mmCopyTo(ev,cut){if(mode!=='mindmap'||mmEdit)return;const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;if(!mmCopy())return;
  mmClipText=mmOutline(mmTop().map(mmFind));ev.clipboardData.setData('text/plain',mmClipText);ev.preventDefault();if(cut)mmDelete();}
document.addEventListener('copy',ev=>mmCopyTo(ev,false));document.addEventListener('cut',ev=>mmCopyTo(ev,true));
// 붙여넣기: 외부 그림 → 고른 주제에 붙이기(없으면 새 주제), 이 앱에서 복사한 주제 → 가지째, 다른 곳의 글 → 줄마다 주제(들여쓰기는 단계)
document.addEventListener('paste',ev=>{if(mode!=='mindmap'||mmEdit)return;const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  const cd=ev.clipboardData;if(!cd)return;const file=[...cd.items||[]].map(i=>i.kind==='file'&&i.type.startsWith('image/')?i.getAsFile():null).find(Boolean);
  if(file){ev.preventDefault();mmAddImage(file,mmPick().pop());return;}
  const text=(cd.getData('text/plain')||'').replace(/\r/g,'');
  if(mmClip&&(!text||text===mmClipText)){ev.preventDefault();mmPaste();return;}
  if(text.trim()){ev.preventDefault();mmPasteText(text);}});
function mmPasteText(text){const p=mmFind(mmPick()[0])||mm.root;const top=[],stack=[];
  for(const raw of text.split('\n')){if(!raw.trim())continue;const ind=(raw.match(/^[\t ]*/)[0]).replace(/ {2}/g,'\t').length;const t=mmTopic(raw.trim().replace(/^[-*•·]\s+/,''));while(stack.length&&stack[stack.length-1].ind>=ind)stack.pop();
    (stack.length?stack[stack.length-1].t.children:top).push(t);stack.push({t,ind});}
  if(!top.length)return;mmMutate(()=>{p.collapsed=false;for(const c of top){if(p===mm.root){c.side=mmSideFor();c.ci=mmNextCi();}p.children.push(c);}});mmSel=new Set(top.map(c=>c.id));mmRender();mmEnsureVisible(top[0].id);}
mmStage.addEventListener('dragover',ev=>{if([...ev.dataTransfer.types].includes('Files')){ev.preventDefault();ev.dataTransfer.dropEffect='copy';}});
mmStage.addEventListener('drop',ev=>{const f=[...ev.dataTransfer.files].find(x=>x.type.startsWith('image/'));if(!f)return;ev.preventDefault();const el=document.elementFromPoint(ev.clientX,ev.clientY),g=el&&el.closest&&el.closest('[data-mid]');mmAddImage(f,g?g.dataset.mid:mmPick().pop());});
const mmImgIn=document.createElement('input');mmImgIn.type='file';mmImgIn.accept='image/*';mmImgIn.addEventListener('change',()=>{const f=mmImgIn.files[0];if(f)mmAddImage(f,mmPick().pop());mmImgIn.value='';});

/* inspector + rail */
function mmRenderInsp(){if(mode!=='mindmap')return;const seg=(key,opts,cur)=>`<div class="seg">${opts.map(([v,t])=>`<button data-mm="${key}:${v}" class="${cur===v?'on':''}">${L(t)}</button>`).join('')}</div>`;
  const ids=mmPick(),t=ids.length?mmFind(ids[ids.length-1]):null,Lt=t&&mmLay.get(t.id);
  let h=`<div class="sec"><h4>${L('마인드맵')}</h4>
  <div class="fld"><label>${L('배치')}</label>${seg('layout',[['balanced','양쪽 균형'],['right','오른쪽으로']],mm.layout)}</div>
  <div class="fld"><label>${L('주제 기본 모양')}</label>${seg('shape',[['text','글씨 + 밑줄'],['box','상자']],mm.shape||'text')}</div>
  <div class="fld"><label>${L('색 구성')}</label>${seg('theme',[['colorful','컬러'],['mono','단색']],mm.theme)}</div>
  <div class="fld"><label>${L('글꼴')}</label><select class="in" data-mm-font>${FONTS.map(f=>`<option value="${f.id}" ${mm.font===f.id?'selected':''}>${L(f.label)}</option>`).join('')}</select></div></div>`;
  if(t){const d=Lt?Lt.depth:1;h+=`<div class="sec"><h4>${L('주제')}<span class="sub">${L('{n}개 선택',{n:ids.length})}</span></h4>
  <div class="row"><button class="btn grow" data-mm="add-child">${L('하위 주제')} <small>Tab</small></button><button class="btn grow" data-mm="add-sib">${L('같은 수준')} <small>Enter</small></button></div>
  <div class="row"><button class="btn grow" data-mm="toggle">${L('접기 / 펼치기')}</button><button class="btn grow danger" data-mm="delete" ${t===mm.root&&ids.length===1?'disabled':''}>${L('삭제')} <small>Del</small></button></div>
  <div class="fld"><label>${L('모양')}</label>${seg('tshape',MM_SHAPES,Lt?Lt.shape:'text')}</div>
  <div class="row"><div class="fld"><label>${L('글자 크기')}</label><input class="in" type="number" min="8" max="72" step="1" data-mm-fs value="${Lt?Lt.fs:14}"></div><div class="fld"><label>${L('스타일')}</label><button class="btn ${Lt&&Lt.bold?'on':''}" data-mm="bold"><b>B</b></button></div></div>
  <div class="fld"><label>${L('그림')}</label><div class="row"><button class="btn grow" data-mm="img-add">${L(t.img?'그림 바꾸기…':'그림 넣기…')}</button>${t.img?`<button class="btn danger" data-mm="img-del">${L('빼기')}</button>`:''}</div>
  ${t.img?`<input type="range" min="24" max="320" step="2" value="${Math.max(t.img.w,t.img.h)}" data-mm-imgsize style="width:100%">`:`<p class="note" style="margin:2px 0 0">${L('그림을 복사해 Ctrl+V로 붙이거나, 파일을 주제 위로 끌어다 놓아도 됩니다.')}</p>`}</div>
  ${d>0?`<div class="fld"><label>${L('가지 색')}</label><div class="sw">${MM_COLORS.concat(['#4A5361']).map(c=>`<button data-mm="color:${c}" class="${t.color===c?'on':''}" style="background:${c}" title="${c}"></button>`).join('')}<button class="none ${t.color?'':'on'}" data-mm="color:" title="${L('자동')}"></button></div></div>`:''}</div>`;}
  h+=`<div class="sec"><h4>${L('사용법')}</h4><p class="note">${L('<b>Tab</b> 하위 주제 · <b>Enter</b> 같은 수준 주제 · <b>Delete</b> 삭제<br>더블클릭·F2 또는 주제를 고른 채 바로 입력하면 글자를 고칩니다 (Shift+Enter 줄바꿈).<br>주제를 끌어 다른 주제 위에 놓으면 그 아래로 옮겨지고, 빈 곳에 놓으면 순서·방향이 바뀝니다.<br>그림은 복사해서 Ctrl+V로 붙이거나 파일을 끌어다 놓습니다. 다른 곳의 글을 붙이면 줄마다 주제가 됩니다(들여쓰기는 하위 주제).<br>방향키로 주제 사이를 이동하고, Alt+↑/↓로 순서를 바꿉니다. 가지 끝의 동그라미를 누르면 접히고 펼쳐집니다.')}</p></div>`;
  mmInsp.innerHTML=h;}
function mmAction(a){const ids=mmPick(),cur=ids[ids.length-1];
  if(a.startsWith('layout:')||a.startsWith('theme:')||a.startsWith('shape:')){const [k,v]=a.split(':');mmMutate(()=>{mm[k]=v;});requestAnimationFrame(mmFit);return;}
  if(a.startsWith('tshape:')){const v=a.slice(7);mmMutate(()=>ids.forEach(id=>{mmFind(id).shape=v;}));return;}
  if(a==='add-child')mmAddChild(cur||mm.root.id);else if(a==='add-sib')cur?mmAddSibling(cur):mmAddChild(mm.root.id);else if(a==='delete')mmDelete();else if(a==='toggle')mmToggle();else if(a==='fit')mmFit();
  else if(a==='img-add')mmImgIn.click();else if(a==='img-del')mmMutate(()=>ids.forEach(id=>{delete mmFind(id).img;}));
  else if(a==='bold'){const L0=mmLay.get(cur);const to=!(L0&&L0.bold);mmMutate(()=>ids.forEach(id=>{mmFind(id).bold=to;}));}
  else if(a.startsWith('color:')){const c=a.slice(6);mmMutate(()=>ids.forEach(id=>{const t=mmFind(id);if(c)t.color=c;else delete t.color;}));}}
mmInsp.addEventListener('click',ev=>{const b=ev.target.closest('[data-mm]');if(b&&!b.disabled)mmAction(b.dataset.mm);});
mmInsp.addEventListener('change',ev=>{const t=ev.target;if(t.matches('[data-mm-font]'))mmMutate(()=>{mm.font=t.value;});else if(t.matches('[data-mm-fs]')){const v=clamp(+t.value||14,8,72);mmMutate(()=>mmPick().forEach(id=>{mmFind(id).fs=v;}));}
  else if(t.matches('[data-mm-imgsize]')){const v=+t.value;mmMutate(()=>mmPick().forEach(id=>{const im=mmFind(id).img;if(im){const k=v/Math.max(im.nw||im.w,im.nh||im.h);im.w=Math.round((im.nw||im.w)*k);im.h=Math.round((im.nh||im.h)*k);}}));}});
mmInsp.addEventListener('input',ev=>{const t=ev.target;if(!t.matches('[data-mm-imgsize]'))return;const v=+t.value;for(const id of mmPick()){const im=mmFind(id).img;if(im){const k=v/Math.max(im.nw||im.w,im.nh||im.h);im.w=Math.round((im.nw||im.w)*k);im.h=Math.round((im.nh||im.h)*k);}}mmRender();});
$('#mm-rail').addEventListener('click',ev=>{const b=ev.target.closest('[data-mm]');if(b)mmAction(b.dataset.mm);});

/* export · mode switch */
async function mmExportSVG(){mmLayout();mmRender();const b=mmBBox(),m=40,w=Math.ceil(b.w+m*2),h=Math.ceil(b.h+m*2),x=Math.floor(b.x-m),y=Math.floor(b.y-m);const out=svgEl('svg',{xmlns:NS,'xmlns:xlink':'http://www.w3.org/1999/xlink',viewBox:`${x} ${y} ${w} ${h}`,width:w,height:h});
  const fig=gMM.cloneNode(true);fig.removeAttribute('id');fig.querySelectorAll('.mm-tog.exp,[fill="transparent"]').forEach(e=>e.remove());fig.querySelectorAll('[data-mid],[data-mm-tog]').forEach(e=>{e.removeAttribute('data-mid');e.removeAttribute('data-mm-tog');e.removeAttribute('class');});
  out.appendChild(svgEl('rect',{x,y,width:w,height:h,fill:'#FFFFFF'}));out.appendChild(fig);return {svg:'<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(out),w,h};}
function mmLoadDoc(d,keepHist){if(!keepHist){mmHist=[];mmFut=[];}else mmSnap();mm=mmNorm(d);mmSel.clear();mmPersist();mmRender();mmRenderInsp();mmUndoBtns();requestAnimationFrame(mmFit);}
function setMode(m,force){if(m===mode&&!force)return;if(editing)commitEdit();mmCommit();mode=m;try{localStorage.setItem('figureassist.mode',m);}catch(e){}
  $('.app').classList.toggle('mm-on',m==='mindmap');$$('#modesw button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));closeMenus();
  if(m==='mindmap'){if(!mm)mmLoad();mmRender();mmRenderInsp();mmUndoBtns();$('#st-hint').textContent=L(MM_HINT);requestAnimationFrame(()=>{mmFitted?mmApplyView():mmFit();});}
  else{setTool(tool);renderAll();updateUndoButtons();requestAnimationFrame(applyView);}}
$$('#modesw button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
window.addEventListener('resize',()=>{if(mode==='mindmap'){mmApplyView();if(mmEdit)mmPlaceEditor();}});
function mmKeysDialog(){const bg=document.createElement('div');bg.className='modal-bg';const K=[['Tab','하위 주제 추가'],['Enter','같은 수준 주제 추가'],['F2 · Space','글자 편집 (바로 입력해도 됨)'],['Shift+Enter','편집 중 줄바꿈'],['Delete','주제 삭제'],['방향키','주제 사이 이동'],['Alt+↑ / ↓','순서 바꾸기'],['Ctrl+/','가지 접기 / 펼치기'],['Ctrl+클릭','여러 주제 선택'],['Ctrl+C / X / V','복사 / 잘라내기 / 붙여넣기'],['Ctrl+D','복제'],['Ctrl+Z / Y','실행 취소 / 다시 실행'],['드래그','주제 위에 놓기: 이동 · 빈 곳: 순서/방향'],['Ctrl+휠','확대/축소']];
  bg.innerHTML=`<div class="modal"><h3>${L('마인드맵 단축키')}</h3><div class="keys">${K.map(([k,v])=>`<kbd>${L(k)}</kbd><span>${L(v)}</span>`).join('')}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="close-keys">${L('닫기')}</button></div></div>`;document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg||e.target.id==='close-keys')bg.remove();});}

/* ---------- boot ---------- */
(function boot(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem('figureassist.doc.v3')||localStorage.getItem('figuregrid.doc.v2'));}catch(e){}
  if(saved&&saved.elements){state=Object.assign(newDoc(),saved);state.style=Object.assign(defaultStyle(),saved.style||{});}else state=TEMPLATES.rnaseq();
  applyStaticI18n();renderAll();requestAnimationFrame(fitPage);setTool('select');
  if(mode==='mindmap')setMode('mindmap',true);
})();
})();
</script>
