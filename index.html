<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow-assist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root{
  --bg:#E6E9EE; --chrome:#F8F9FB; --chrome-2:#EEF0F4; --chrome-3:#E3E6EC;
  --line:#D8DCE4; --line-strong:#C3C9D4;
  --ink:#1B1F27; --muted:#5F6B7C; --faint:#98A2B3;
  --accent:#2F5FA8; --accent-soft:#E2EBF9; --accent-ink:#1E4A82;
  --guide:#E0338F; --danger:#C43C3C; --good:#2F8F6B;
  --paper:#FFFFFF; --paper-shadow:rgba(20,24,32,.18);
  --sketch:#8B4FB0;
  --r-s:5px; --r-m:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181D; --chrome:#1E2228; --chrome-2:#252A32; --chrome-3:#2D333C;
    --line:#333944; --line-strong:#434B58;
    --ink:#E6E8EC; --muted:#9AA3B2; --faint:#68717F;
    --accent:#7BA3E3; --accent-soft:#26364F; --accent-ink:#BFD5F5;
    --guide:#F05DAE; --danger:#E06B6B; --good:#5FCBA0;
    --paper-shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#15181D; --chrome:#1E2228; --chrome-2:#252A32; --chrome-3:#2D333C;
  --line:#333944; --line-strong:#434B58;
  --ink:#E6E8EC; --muted:#9AA3B2; --faint:#68717F;
  --accent:#7BA3E3; --accent-soft:#26364F; --accent-ink:#BFD5F5;
  --guide:#F05DAE; --danger:#E06B6B; --good:#5FCBA0;
  --paper-shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:13px;overflow:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{height:100vh;display:grid;grid-template-rows:46px 1fr 24px;grid-template-columns:100%}
.topbar{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:8px}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--faint);font-family:"IBM Plex Mono",monospace}
.tb{height:30px;padding:0 10px;border:1px solid transparent;border-radius:var(--r-s);background:transparent;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.tb:hover{background:var(--chrome-2);color:var(--ink)}
.tb.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb.primary:hover{filter:brightness(1.08);color:#fff}
.tb svg{width:15px;height:15px}
.tb:disabled{opacity:.4;cursor:default}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.grow{flex:1}
.menu{position:relative}
.menu .dd{position:absolute;top:34px;left:0;min-width:210px;background:var(--chrome);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 10px 30px -10px rgba(0,0,0,.35);padding:6px;z-index:30}
.menu .dd.right{left:auto;right:0}
.dd button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:8px 10px;border:none;background:transparent;border-radius:var(--r-s);color:var(--ink)}
.dd button:hover{background:var(--chrome-2)}
.dd button small{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:10.5px}
.dd .dd-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:6px 10px 4px}
.zoom{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);height:30px;overflow:hidden}
.zoom button{border:none;background:transparent;width:28px;height:100%;color:var(--muted)}
.zoom button:hover{background:var(--chrome-2);color:var(--ink)}
.zoom span{font-family:"IBM Plex Mono",monospace;font-size:11.5px;min-width:46px;text-align:center;color:var(--muted)}

.main{display:grid;grid-template-columns:56px 1fr 272px;min-height:0}
.rail{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;overflow-y:auto}
.rail .rgrp{display:flex;flex-direction:column;gap:2px;padding:4px 0;border-bottom:1px solid var(--line);width:100%;align-items:center}
.rail .rgrp:last-child{border-bottom:none}
.rb{width:38px;height:36px;border:1px solid transparent;border-radius:var(--r-s);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative}
.rb svg{width:18px;height:18px}
.rb:hover{background:var(--chrome-2);color:var(--ink)}
.rb.active{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.rb .kbd{position:absolute;right:3px;bottom:2px;font-size:8.5px;font-family:"IBM Plex Mono",monospace;color:var(--faint)}
.rb.active .kbd{color:var(--accent-ink)}

.stage{position:relative;overflow:hidden;background:var(--bg);touch-action:none}
.stage svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.stage.tool-hand{cursor:grab}
.stage.tool-pen{cursor:crosshair}
.stage.tool-text,.stage.tool-shape,.stage.tool-connect{cursor:crosshair}
.stage.panning{cursor:grabbing}
.stage.moving,.stage.moving *{cursor:grabbing!important}
.edit-box{position:absolute;z-index:20;border:1.5px solid var(--accent);background:#fff;color:#1A1A1A;padding:2px 6px;resize:none;overflow:hidden;line-height:1.25;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:3px;outline:none}
.edit-box.rich{white-space:pre-wrap;word-break:break-word;cursor:text}
.edit-tools{position:absolute;z-index:21;display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--chrome);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 8px 24px -8px rgba(0,0,0,.35);font-size:12px;color:var(--muted);white-space:nowrap}
.edit-tools .btn{padding:2px 8px}.edit-tools .in{width:56px}
.modesw{display:flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;height:30px;margin-right:4px}
.modesw button{border:none;border-right:1px solid var(--line);background:transparent;padding:0 10px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.modesw button:last-child{border-right:none}
.modesw button:hover{background:var(--chrome-2);color:var(--ink)}
.modesw button.on{background:var(--accent-soft);color:var(--accent-ink)}
.modesw svg{width:15px;height:15px}
.app:not(.mm-on) .mm-only,.app.mm-on .wf-only,.app.mm-on #rail,.app.mm-on #stage,.app.mm-on #inspector{display:none!important}
#mm-stage{background:var(--paper)}
#mm-stage .mm-node{cursor:pointer}
#mm-stage .mm-tog{cursor:pointer}
#mm-stage .mm-tog.exp{opacity:0;transition:opacity .12s}
#mm-stage .mm-node:hover .mm-tog.exp,#mm-stage .mm-node.sel .mm-tog.exp{opacity:1}
.mm-edit{white-space:pre-wrap;word-break:break-word;cursor:text;line-height:1.3;text-align:center;box-sizing:border-box}
.sketch-pop{position:absolute;z-index:22;display:flex;align-items:center;gap:3px;padding:5px;background:var(--chrome);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 8px 24px -8px rgba(0,0,0,.35)}
.sketch-pop .lbl{font-size:10.5px;color:var(--faint);padding:0 6px 0 4px;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.sketch-pop button{width:32px;height:30px;border:1px solid transparent;border-radius:var(--r-s);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.sketch-pop button svg{width:17px;height:17px}
.sketch-pop button:hover{background:var(--chrome-2);color:var(--ink)}
.sketch-pop button.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.sketch-pop button.txt{width:auto;padding:0 8px;font-size:11.5px}

.inspector{background:var(--chrome);border-left:1px solid var(--line);overflow-y:auto;padding:12px 14px 40px;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sec h4 .sub{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-family:"IBM Plex Mono",monospace}
.row{display:flex;gap:6px;align-items:center}
.row.wrap{flex-wrap:wrap}
.fld{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fld label{font-size:10px;color:var(--muted);font-family:"IBM Plex Mono",monospace;letter-spacing:.02em}
.in{width:100%;height:28px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--chrome-2);padding:0 7px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink)}
.in:focus{border-color:var(--accent);outline:none}
select.in{font-family:"IBM Plex Sans KR",sans-serif;font-size:12px}
.in.text{font-family:"IBM Plex Sans KR",sans-serif}
.btn{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--chrome-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px;white-space:nowrap}
.btn:hover{background:var(--chrome-3)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:rgba(196,60,60,.1)}
.btn.grow{flex:1}
.btn svg{width:14px;height:14px}
.ibtn{width:30px;padding:0}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.seg button{flex:1;height:28px;border:none;background:var(--chrome-2);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px;font-size:11.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--chrome-3);color:var(--ink)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink)}
.seg button svg{width:15px;height:15px}
.shapes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.shapes button{height:32px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--chrome-2);color:var(--muted);display:flex;align-items:center;justify-content:center}
.shapes button svg{width:18px;height:18px}
.shapes button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);padding:0;position:relative}
.sw button.on::after{content:"";position:absolute;inset:-4px;border:2px solid var(--accent);border-radius:50%}
.sw button.none{background:transparent!important;border:1.5px dashed var(--line-strong)}
.sw button.add{background:var(--chrome-2);color:var(--muted);font-size:15px;line-height:1;border-style:dashed}
.sw button.add:hover{color:var(--ink);border-color:var(--accent)}
.imglib{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.imglib button{aspect-ratio:1;border:1px solid var(--line);border-radius:var(--r-s);background:#fff;padding:4px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.imglib button:hover{border-color:var(--accent)}
.imglib img{max-width:100%;max-height:100%}
.color-pop{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface,var(--chrome-2));padding:10px;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cgrid button{aspect-ratio:1;border-radius:4px;border:1px solid var(--line-strong);padding:0;cursor:pointer}
.cgrid button:hover{outline:2px solid var(--accent);outline-offset:1px}
#color-in2{width:34px;height:28px;padding:2px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--chrome-2);cursor:pointer}
.note{font-size:11.5px;color:var(--muted);line-height:1.55}
.note b{color:var(--ink);font-weight:600}
.presets{display:flex;gap:5px}
.preset{flex:1;border:1px solid var(--line);border-radius:var(--r-s);background:var(--chrome-2);padding:7px 6px;text-align:left;display:flex;flex-direction:column;gap:2px}
.preset b{font-size:12px}
.preset small{font-size:10px;color:var(--faint);font-family:"IBM Plex Mono",monospace}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.kv b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:500}

.status{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--chrome);border-top:1px solid var(--line);font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.status .grow{flex:1}
.status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:middle}

.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:9px 14px;border-radius:var(--r-m);font-size:12.5px;z-index:50;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--chrome);border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:15px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.keys kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--chrome-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;white-space:nowrap}
.keys span{color:var(--muted)}

@media (max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr 40vh}
  .rail{flex-direction:row;border-right:none;border-bottom:1px solid var(--line);padding:4px 8px;overflow-x:auto;overflow-y:hidden}
  .rail .rgrp{flex-direction:row;border-bottom:none;border-right:1px solid var(--line);padding:0 4px;width:auto}
  .inspector{border-left:none;border-top:1px solid var(--line)}
  .topbar .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand"><b>Workflow-assist</b><span class="hide-sm">journal-grade workflow figures</span></div>
    <div class="modesw" id="modesw">
      <button data-mode="workflow" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="5" rx="1"/><rect x="14" y="15" width="7" height="5" rx="1"/><path d="M6.5 9v4.5h11V15"/></svg><span class="hide-sm" data-i18n>워크플로우</span></button>
      <button data-mode="mindmap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M9.2 10.8C7 9 6 6.5 4 6M9.2 13.2C7 15 6 17.5 4 18M14.8 10.8C17 9 18 6.5 20 6M14.8 13.2C17 15 18 17.5 20 18"/></svg><span class="hide-sm" data-i18n>마인드맵</span></button>
    </div>
    <div class="menu" id="menu-file">
      <button class="tb" data-menu="file"><span data-i18n>파일</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="dd" hidden>
        <div class="dd-title" data-i18n>문서</div>
        <button class="wf-only" data-act="new"><span data-i18n>새 문서</span> <small data-i18n>빈 캔버스</small></button>
        <button class="mm-only" data-act="mm:blank"><span data-i18n>새 마인드맵</span> <small data-i18n>중심 주제 + 가지 4개</small></button>
        <button data-act="import" data-i18n>JSON 불러오기…</button>
        <div class="dd-title wf-only" data-i18n>일반 예제</div>
        <button class="wf-only" data-act="tpl:flowchart" data-i18n>기본 순서도 (시작 · 판단 · 종료)</button>
        <button class="wf-only" data-act="tpl:orgchart" data-i18n>조직도</button>
        <button class="wf-only" data-act="tpl:pdca" data-i18n>PDCA 순환도</button>
        <div class="dd-title wf-only" data-i18n>논문용 예제</div>
        <button class="wf-only" data-act="tpl:rnaseq" data-i18n>실험 워크플로우 (패널 a·b·c)</button>
        <button class="wf-only" data-act="tpl:consort" data-i18n>CONSORT 참가자 흐름도</button>
        <button class="wf-only" data-act="tpl:prisma" data-i18n>PRISMA 2020 문헌 선별 흐름도</button>
        <button class="wf-only" data-act="tpl:studydesign" data-i18n>연구 설계 (무작위 배정 · 추적)</button>
        <button class="wf-only" data-act="tpl:ml" data-i18n>ML 파이프라인 (판단 루프)</button>
        <button class="wf-only" data-act="tpl:invivo" data-i18n>동물실험 타임라인</button>
        <button class="wf-only" data-act="tpl:cohort" data-i18n>관찰 코호트 참가자 흐름 (STROBE)</button>
        <div class="dd-title wf-only" data-i18n>보고서용 예제</div>
        <button class="wf-only" data-act="tpl:approval" data-i18n>업무 승인 프로세스 (스윔레인)</button>
        <button class="wf-only" data-act="tpl:phases" data-i18n>프로젝트 단계 (Phase-gate)</button>
        <button class="wf-only" data-act="tpl:dataflow" data-i18n>시스템 데이터 흐름도</button>
        <button class="wf-only" data-act="tpl:asistobe" data-i18n>AS-IS / TO-BE 비교</button>
        <button class="wf-only" data-act="tpl:roadmap" data-i18n>로드맵 (분기별 마일스톤)</button>
        <div class="dd-title mm-only" data-i18n>마인드맵 예제</div>
        <button class="mm-only" data-act="mm:research" data-i18n>연구 계획 정리</button>
        <button class="mm-only" data-act="mm:project" data-i18n>프로젝트 기획</button>
        <button class="mm-only" data-act="mm:spoonbills">Spoonbills</button>
      </div>
    </div>
    <div class="menu" id="menu-export">
      <button class="tb" data-menu="export"><span data-i18n>내보내기</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="dd" hidden>
        <button data-act="export:svg"><span data-i18n>SVG (벡터)</span> <small>journal</small></button>
        <button data-act="export:png">PNG <small>3× ≈ 300 dpi</small></button>
        <button data-act="export:json" data-i18n>JSON (편집용)</button>
        <button data-act="export:copysvg"><span data-i18n>SVG 코드 복사</span> <small>clipboard</small></button>
      </div>
    </div>
    <div class="sep"></div>
    <button class="tb" id="btn-undo" data-i18n-title title="실행 취소 (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-2"/></svg></button>
    <button class="tb" id="btn-redo" data-i18n-title title="다시 실행 (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h2"/></svg></button>
    <div class="grow"></div>
    <div class="zoom">
      <button id="zoom-out" data-i18n-title title="축소">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" data-i18n-title title="확대">+</button>

function mixWhite(hex,t){const n=parseInt(hex.slice(1),16);const m=v=>Math.round(v+(255-v)*t);return '#'+[m((n>>16)&255),m((n>>8)&255),m(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();}

function importImageFile(f){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth||256,h=img.naturalHeight||256;let src;if(f.type==='image/svg+xml'){src=rd.result;}else{const max=640,sc=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);src=c.toDataURL('image/png');if(src.length>350000)src=c.toDataURL('image/jpeg',.85);}res({id:uid(),name:f.name.replace(/\.[^.]+$/,''),src,w,h});};img.onerror=()=>rej(new Error('decode'));img.src=rd.result;};rd.onerror=()=>rej(new Error('read'));rd.readAsDataURL(f);});}

/* ---------- history / persistence ---------- */
function snapshot(){ history.push(JSON.stringify(state)); if(history.length>100) history.shift(); future=[]; updateUndoButtons(); }
function undo(){ if(!history.length) return; future.push(JSON.stringify(state)); state=JSON.parse(history.pop()); pruneSel(); renderAll(); persist(); }
function redo(){ if(!future.length) return; history.push(JSON.stringify(state)); state=JSON.parse(future.pop()); pruneSel(); renderAll(); persist(); }
function updateUndoButtons(){ $('#btn-undo').disabled=!history.length; $('#btn-redo').disabled=!future.length; }
function mutate(fn){ snapshot(); fn(); changed(); }
function changed(){ renderCanvas(); persist(); }
function persist(){ try{ localStorage.setItem('figureassist.doc.v3',JSON.stringify(state)); }catch(e){} emit('change'); }
function pruneSel(){ for(const id of Array.from(sel)) if(!anyById(id)) sel.delete(id); }

/* ---------- geometry ---------- */
const DIR={t:{dx:0,dy:-1},r:{dx:1,dy:0},b:{dx:0,dy:1},l:{dx:-1,dy:0}};
function portPoint(n,port){const c=center(n);const p={t:{x:c.x,y:n.y},r:{x:n.x+n.w,y:c.y},b:{x:c.x,y:n.y+n.h},l:{x:n.x,y:c.y}}[port];return Object.assign({},p,DIR[port],{port});}
function nearestPort(n,p){let best='t',bd=1e9;for(const k of 'trbl'){const q=portPoint(n,k);const d=dist(q,p);if(d<bd){bd=d;best=k;}}return best;}
function elBBox(e){ if(e.type==='text') return {x:e.x,y:e.y-(e._h||16),w:e._w||60,h:e._h||16}; if(e.type==='ink'){const xs=e.pts.map(p=>p.x),ys=e.pts.map(p=>p.y);const x=Math.min(...xs),y=Math.min(...ys);return {x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};} return {x:e.x,y:e.y,w:e.w,h:e.h}; }
function ptIn(bb,p,pad=0){return p.x>=bb.x-pad&&p.x<=bb.x+bb.w+pad&&p.y>=bb.y-pad&&p.y<=bb.y+bb.h+pad;}
function intersects(a,b){return a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;}
function nodeAt(p,pad=0){ for(let i=state.elements.length-1;i>=0;i--){const e=state.elements[i]; if(e.type==='node'&&ptIn(elBBox(e),p,pad)) return e;} return null; }

function resolveEnds(e){
  const a=e.from.node?byId(e.from.node):null, b=e.to.node?byId(e.to.node):null;
  if((e.from.node&&!a)||(e.to.node&&!b)) return null;
  const ca=a?center(a):{x:e.from.x,y:e.from.y}, cb=b?center(b):{x:e.to.x,y:e.to.y};
  const dx=cb.x-ca.x, dy=cb.y-ca.y, horiz=Math.abs(dx)>=Math.abs(dy);
  let pa=e.from.port||'auto', pb=e.to.port||'auto';
  if(pa==='auto') pa=horiz?(dx>=0?'r':'l'):(dy>=0?'b':'t');
  if(pb==='auto') pb=horiz?(dx>=0?'l':'r'):(dy>=0?'t':'b');
  const A=a?portPoint(a,pa):Object.assign({x:ca.x,y:ca.y},DIR[pa]);
  const B=b?portPoint(b,pb):Object.assign({x:cb.x,y:cb.y},DIR[pb]);
  return {A,B,a,b};
}
function detourY(a,b,A,B,ext){const ra=a?{t:a.y,b:a.y+a.h}:{t:A.y,b:A.y},rb=b?{t:b.y,b:b.y+b.h}:{t:B.y,b:B.y};const ov=ra.t<rb.b&&rb.t<ra.b;if(ov)return Math.max(ra.b,rb.b)+ext+8;return (Math.min(ra.b,rb.b)+Math.max(ra.t,rb.t))/2;}
function detourX(a,b,A,B,ext){const ra=a?{l:a.x,r:a.x+a.w}:{l:A.x,r:A.x},rb=b?{l:b.x,r:b.x+b.w}:{l:B.x,r:B.x};const ov=ra.l<rb.r&&rb.l<ra.r;if(ov)return Math.max(ra.r,rb.r)+ext+8;return (Math.min(ra.r,rb.r)+Math.max(ra.l,rb.l))/2;}
function simplifyPts(pts){const out=[];for(const p of pts){const q=out[out.length-1];if(q&&Math.abs(q.x-p.x)<.01&&Math.abs(q.y-p.y)<.01)continue;out.push({x:p.x,y:p.y});}for(let i=1;i<out.length-1;){const a=out[i-1],b=out[i],c=out[i+1];const col=(Math.abs(a.x-b.x)<.01&&Math.abs(b.x-c.x)<.01)||(Math.abs(a.y-b.y)<.01&&Math.abs(b.y-c.y)<.01);if(col)out.splice(i,1);else i++;}return out;}

function routeEdge(e){
  const r=resolveEnds(e); if(!r) return null;
  const {A,B,a,b}=r; const ext=18;
  if(e.route==='straight') return {pts:[A,B],A,B};
  if(e.route==='curve'){const d=dist(A,B);const k=Math.max(30,d*.45);return {cubic:[A,{x:A.x+A.dx*k,y:A.y+A.dy*k},{x:B.x+B.dx*k,y:B.y+B.dy*k},B],A,B};}
  const aH=A.dx!==0,bH=B.dx!==0; let pts,handle=null,axis=null;
  if(aH&&bH){
    if(A.dx===-B.dx){
      if((B.x-A.x)*A.dx>0){
        if(Math.abs(A.y-B.y)<.5) return {pts:[A,B],A,B};
        const midX=e.bend!=null?A.x+e.bend:(A.x+B.x)/2;
        pts=[A,{x:midX,y:A.y},{x:midX,y:B.y},B];handle={x:midX,y:(A.y+B.y)/2};axis='x';
      }else{
        const midY=e.bend!=null?A.y+e.bend:detourY(a,b,A,B,ext);const p1x=A.x+A.dx*ext,p2x=B.x+B.dx*ext;
        pts=[A,{x:p1x,y:A.y},{x:p1x,y:midY},{x:p2x,y:midY},{x:p2x,y:B.y},B];handle={x:(p1x+p2x)/2,y:midY};axis='y';
      }
    }else{
      const cx=e.bend!=null?A.x+e.bend:(A.dx>0?Math.max(A.x,B.x)+ext:Math.min(A.x,B.x)-ext);
      pts=[A,{x:cx,y:A.y},{x:cx,y:B.y},B];handle={x:cx,y:(A.y+B.y)/2};axis='x';
    }
  }else if(!aH&&!bH){
    if(A.dy===-B.dy){
      if((B.y-A.y)*A.dy>0){
        if(Math.abs(A.x-B.x)<.5) return {pts:[A,B],A,B};
        const midY=e.bend!=null?A.y+e.bend:(A.y+B.y)/2;
        pts=[A,{x:A.x,y:midY},{x:B.x,y:midY},B];handle={x:(A.x+B.x)/2,y:midY};axis='y';
      }else{
        const midX=e.bend!=null?A.x+e.bend:detourX(a,b,A,B,ext);const p1y=A.y+A.dy*ext,p2y=B.y+B.dy*ext;
        pts=[A,{x:A.x,y:p1y},{x:midX,y:p1y},{x:midX,y:p2y},{x:B.x,y:p2y},B];handle={x:midX,y:(p1y+p2y)/2};axis='x';
      }
    }else{
      const cy=e.bend!=null?A.y+e.bend:(A.dy>0?Math.max(A.y,B.y)+ext:Math.min(A.y,B.y)-ext);
      pts=[A,{x:A.x,y:cy},{x:B.x,y:cy},B];handle={x:(A.x+B.x)/2,y:cy};axis='y';
    }
  }else if(aH){
    const ahead=(B.x-A.x)*A.dx>ext&&(A.y-B.y)*B.dy>ext;
    if(ahead)pts=[A,{x:B.x,y:A.y},B];else{const p1x=A.x+A.dx*ext,p2y=B.y+B.dy*ext;pts=[A,{x:p1x,y:A.y},{x:p1x,y:p2y},{x:B.x,y:p2y},B];}
  }else{
    const ahead=(B.y-A.y)*A.dy>ext&&(A.x-B.x)*B.dx>ext;
    if(ahead)pts=[A,{x:A.x,y:B.y},B];else{const p1y=A.y+A.dy*ext,p2x=B.x+B.dx*ext;pts=[A,{x:A.x,y:p1y},{x:p2x,y:p1y},{x:p2x,y:B.y},B];}
  }
  return {pts:simplifyPts(pts),handle,axis,A,B};
}
function trimPoly(pts,startLen,endLen){const out=pts.map(p=>({x:p.x,y:p.y}));if(out.length<2)return out;if(endLen>0){const a=out[out.length-2],b=out[out.length-1];const L=dist(a,b);if(L>endLen+1){const u={x:(b.x-a.x)/L,y:(b.y-a.y)/L};out[out.length-1]={x:b.x-u.x*endLen,y:b.y-u.y*endLen};}}if(startLen>0){const a=out[0],b=out[1];const L=dist(a,b);if(L>startLen+1){const u={x:(b.x-a.x)/L,y:(b.y-a.y)/L};out[0]={x:a.x+u.x*startLen,y:a.y+u.y*startLen};}}return out;}
function polyPath(pts,r){if(pts.length<2)return '';let d=`M${R(pts[0].x)} ${R(pts[0].y)}`;for(let i=1;i<pts.length-1;i++){const p=pts[i],a=pts[i-1],b=pts[i+1];const l1=dist(a,p),l2=dist(p,b);const rr=Math.min(r,l1/2,l2/2);const u1={x:(p.x-a.x)/l1,y:(p.y-a.y)/l1},u2={x:(b.x-p.x)/l2,y:(b.y-p.y)/l2};d+=` L${R(p.x-u1.x*rr)} ${R(p.y-u1.y*rr)} Q${R(p.x)} ${R(p.y)} ${R(p.x+u2.x*rr)} ${R(p.y+u2.y*rr)}`;}const l=pts[pts.length-1];d+=` L${R(l.x)} ${R(l.y)}`;return d;}
function polyMid(pts){let L=0;for(let i=1;i<pts.length;i++)L+=dist(pts[i-1],pts[i]);let t=L/2;for(let i=1;i<pts.length;i++){const s=dist(pts[i-1],pts[i]);if(t<=s){const u=s?t/s:0;return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*u,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*u,horiz:Math.abs(pts[i].x-pts[i-1].x)>Math.abs(pts[i].y-pts[i-1].y)};}t-=s;}return Object.assign({},pts[0],{horiz:true});}
function cubicAt(c,t){const mt=1-t;return {x:mt*mt*mt*c[0].x+3*mt*mt*t*c[1].x+3*mt*t*t*c[2].x+t*t*t*c[3].x,y:mt*mt*mt*c[0].y+3*mt*mt*t*c[1].y+3*mt*t*t*c[2].y+t*t*t*c[3].y};}
function edgeBBox(e){const r=routeEdge(e);if(!r)return null;const pts=r.pts||[r.cubic[0],r.cubic[3]];const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);const x=Math.min(...xs),y=Math.min(...ys);return {x:x-4,y:y-4,w:Math.max(...xs)-x+8,h:Math.max(...ys)-y+8};}

/* ---------- rendering ---------- */
function luminance(hex){if(!hex||hex[0]!=='#')return 1;const n=parseInt(hex.slice(1),16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return (0.2126*r+0.7152*g+0.0722*b)/255;}
// 글자별 크기: label은 그대로 두고, 기본 크기와 다른 구간만 runs=[{s,e,fs}](label 안의 글자 위치)로 저장한다.
function sizeAt(runs,k,fs){for(const r of runs||[])if(k>=r.s&&k<r.e)return r.fs;return fs;}
function runsFrom(sizes,fs){const out=[];sizes.forEach((f,k)=>{if(f===fs)return;const l=out[out.length-1];if(l&&l.e===k&&l.fs===f)l.e=k+1;else out.push({s:k,e:k+1,fs:f});});return out;}
function richLines(label,runs,fs){const out=[[]];for(let k=0;k<label.length;k++){const c=label[k];if(c==='\n'){out.push([]);continue;}const f=sizeAt(runs,k,fs),ln=out[out.length-1],l=ln[ln.length-1];if(l&&l.fs===f)l.t+=c;else ln.push({t:c,fs:f});}return out.map(segs=>({segs,max:segs.length?Math.max(...segs.map(x=>x.fs)):fs}));}
function lineTspan(line,x,y,fs){const t=svgEl('tspan',{x:R(x),y:R(y)});if(!line.segs.length)t.textContent=' ';for(const g of line.segs)t.appendChild(g.fs===fs?document.createTextNode(g.t):svgEl('tspan',{'font-size':g.fs},[g.t]));return t;}
function textLines(label,runs,x,cy,fs,attrs){const t=svgEl('text',Object.assign({'font-size':fs},attrs));const lines=richLines(label,runs,fs);let y=cy-lines.reduce((h,l)=>h+l.max*1.28,0)/2;for(const l of lines){const lh=l.max*1.28;t.appendChild(lineTspan(l,x,y+lh/2+l.max*.36,fs));y+=lh;}return t;}

function nodeShapeEl(n){
  const s=st();const {x,y,w,h}=n;const fill=n.fill||'#FFFFFF',stroke=n.stroke||s.stroke,sw=n.strokeWidth||s.strokeWidth;
  const base={fill,stroke,'stroke-width':sw,'stroke-linejoin':'round'};
  switch(n.shape){
    case 'rounded':return svgEl('rect',Object.assign({x,y,width:w,height:h,rx:s.radius},base));
    case 'pill':return svgEl('rect',Object.assign({x,y,width:w,height:h,rx:h/2},base));
    case 'diamond':return svgEl('polygon',Object.assign({points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`},base));
    case 'ellipse':return svgEl('ellipse',Object.assign({cx:x+w/2,cy:y+h/2,rx:w/2,ry:h/2},base));
    case 'parallelogram':{const k=Math.min(16,w*.15);return svgEl('polygon',Object.assign({points:`${x+k},${y} ${x+w},${y} ${x+w-k},${y+h} ${x},${y+h}`},base));}
    case 'cylinder':{const ry=Math.min(9,h*.16);const d=`M${x} ${y+ry} A${w/2} ${ry} 0 0 1 ${x+w} ${y+ry} L${x+w} ${y+h-ry} A${w/2} ${ry} 0 0 1 ${x} ${y+h-ry} Z M${x} ${y+ry} A${w/2} ${ry} 0 0 0 ${x+w} ${y+ry}`;return svgEl('path',Object.assign({d},base));}
    case 'hexagon':{const k=Math.min(w*.18,h*.5);return svgEl('polygon',Object.assign({points:`${x+k},${y} ${x+w-k},${y} ${x+w},${y+h/2} ${x+w-k},${y+h} ${x+k},${y+h} ${x},${y+h/2}`},base));}
    case 'chevron':{const k=Math.min(h/2,w*.2);return svgEl('polygon',Object.assign({points:`${x},${y} ${x+w-k},${y} ${x+w},${y+h/2} ${x+w-k},${y+h} ${x},${y+h} ${x+k},${y+h/2}`},base));}
    case 'triangle':return svgEl('polygon',Object.assign({points:`${x+w/2},${y} ${x+w},${y+h} ${x},${y+h}`},base));

/* ---------- smart guides ---------- */
function smartSnap(bb,excl){const th=6/view.zoom;const cand=state.elements.filter(e=>!excl.has(e.id)&&e.type!=='ink').map(e=>e.type==='text'&&e._bb?e._bb:elBBox(e));let bx=null,by=null;const mx=[[bb.x+bb.w/2,'c'],[bb.x,'e'],[bb.x+bb.w,'e']],my=[[bb.y+bb.h/2,'c'],[bb.y,'e'],[bb.y+bb.h,'e']];
  for(const c of cand){const cx=[[c.x+c.w/2,'c'],[c.x,'e'],[c.x+c.w,'e']],cy=[[c.y+c.h/2,'c'],[c.y,'e'],[c.y+c.h,'e']];
    for(const [m,mk] of mx)for(const [v,vk] of cx){const d=v-m;const score=Math.abs(d)+(mk==='c'&&vk==='c'?0:th*.4);if(Math.abs(d)<=th&&(!bx||score<bx.score))bx={d,pos:v,score};}
    for(const [m,mk] of my)for(const [v,vk] of cy){const d=v-m;const score=Math.abs(d)+(mk==='c'&&vk==='c'?0:th*.4);if(Math.abs(d)<=th&&(!by||score<by.score))by={d,pos:v,score};}}

function startEdit(id){

  else if(it.type==='text'){bb={x:it.x-4,y:it.y-(it.fontSize||12)-2,w:Math.max(it._w||60,80)+8,h:Math.max(it._h||16,16)*((it.label||'').split('\n').length)+8};align='left';}

  Object.assign(ta.style,{left:s.x+'px',top:s.y+'px',width:Math.max(bb.w*view.zoom,60)+'px',[rich?'minHeight':'height']:Math.max(bb.h*view.zoom,fs*1.6)+'px',fontSize:fs+'px',fontFamily:fontFamily(),textAlign:it.align==='left'?'left':align,fontWeight:it.bold?'bold':'normal'});
  stage.appendChild(ta);editing={id,ta,rich,base,selRange:[0,0]};if(rich)editing.tools=editTools(s);ta.focus();selectAllIn(ta);

  requestAnimationFrame(refocus);setTimeout(refocus,0);setTimeout(refocus,60);
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitEdit();}else if(e.key==='Enter'&&rich){e.preventDefault();if(!document.execCommand('insertLineBreak'))document.execCommand('insertText',false,'\n');}else if(e.key==='Escape')endEdit();e.stopPropagation();});

function fillRich(root,label,runs,base){root.textContent='';richLines(label,runs,base).forEach((l,i)=>{if(i)root.appendChild(document.createElement('br'));for(const g of l.segs){if(g.fs===base){root.appendChild(document.createTextNode(g.t));continue;}const sp=document.createElement('span');sp.style.fontSize=g.fs*view.zoom+'px';sp.textContent=g.t;root.appendChild(sp);}});if(label.endsWith('\n'))root.appendChild(document.createElement('br'));}

function rdp(pts,eps){if(pts.length<3)return pts.slice();let md=0,idx=0;const a=pts[0],b=pts[pts.length-1];for(let i=1;i<pts.length-1;i++){const d=perp(pts[i],a,b);if(d>md){md=d;idx=i;}}if(md>eps){const l=rdp(pts.slice(0,idx+1),eps),r=rdp(pts.slice(idx),eps);return l.slice(0,-1).concat(r);}return [a,b];}

  for(let i=1;i<simp.length;i++){const a=simp[i-1],b=simp[i];const ang=Math.abs(Math.atan2(b.y-a.y,b.x-a.x));const L=dist(a,b);const ta=Math.min(ang,Math.abs(ang-Math.PI/2),Math.abs(ang-Math.PI)),td=Math.min(Math.abs(ang-Math.PI/4),Math.abs(ang-3*Math.PI/4));if(ta<td)axis+=L;else dg+=L;}
  for(let i=1;i<simp.length-1;i++){const a=simp[i-1],b=simp[i],c=simp[i+1];const v1={x:b.x-a.x,y:b.y-a.y},v2={x:c.x-b.x,y:c.y-b.y};const ang=Math.acos(clamp((v1.x*v2.x+v1.y*v2.y)/((Math.hypot(v1.x,v1.y)||1)*(Math.hypot(v2.x,v2.y)||1)),-1,1));if(ang>Math.PI/3)corners++;}

  }else{

      <div class="row"><button class="btn grow" data-action="duplicate" ${nodes.length?'':'disabled'}>${L('복제')} <small>Ctrl+D</small></button><button class="btn grow danger" data-action="delete">${L('삭제')} <small>Del</small></button></div>

        <div class="row"><div class="fld"><label>${L('간격 고정 (px)')}</label><input class="in" type="number" id="gap-in" value="${s.gap}" step="2" min="0"></div><button class="btn" data-action="gapx" style="align-self:flex-end">${L('가로 적용')}</button><button class="btn" data-action="gapy" style="align-self:flex-end">${L('세로 적용')}</button></div>
        <div class="row"><button class="btn grow" data-action="match" data-value="w">${L('너비 길이 맞춤')}</button><button class="btn grow" data-action="match" data-value="h">${L('높이 길이 맞춤')}</button></div>

    }
    if(onlyNodes.length){
      const n=onlyNodes[0];const same=k=>onlyNodes.every(x=>x[k]===n[k]);
      html+=`<div class="sec"><h4>${L('도형')} ${onlyNodes.length>1?`<span class="sub">${L('{n}개에 적용',{n:onlyNodes.length})}</span>`:''}</h4>
        <div class="shapes">${SHAPES.map(sh=>`<button data-action="shape" data-value="${sh.id}" class="${same('shape')&&n.shape===sh.id?'on':''}" title="${L(sh.label)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${sh.icon}</svg></button>`).join('')}</div>
        ${n.shape==='image'?`<div class="row"><button class="btn grow ${n.mono?'on':''}" data-action="imgmono">${L('단색화 (회색조)')}</button><button class="btn grow ${n.frame?'on':''}" data-action="imgframe">${L('테두리 상자')}</button></div>
        <div class="fld"><label>${L('배경 제거 (누끼) · 강도')}</label><div class="row"><div class="seg" style="flex:1"><button data-action="rmbg" data-value="26">${L('약')}</button><button data-action="rmbg" data-value="46">${L('중')}</button><button data-action="rmbg" data-value="72">${L('강')}</button></div>${n.srcOriginal?`<button class="btn" data-action="restoreimg">${L('원본')}</button>`:''}</div></div>
        ${n.srcOriginal?`<div class="row"><button class="btn grow" data-action="libimg">${L('이 버전을 라이브러리에 추가')}</button></div>`:''}
        <p class="note">${L('가장자리와 이어진 단색 배경(흰색 등)을 투명하게 만듭니다. 사진처럼 배경이 고르지 않으면 "강"을 쓰거나 원본을 배경이 단순한 것으로 준비하세요. 투명해진 자리에는 아래의 채움색이 비칩니다. 캡션은 더블클릭으로 입력합니다.')}</p>`:''}
        <div class="fld"><label>${L('채움')} <span style="color:var(--faint)">${L('(진한 색은 글자가 자동으로 흰색)')}</span></label>${fillSwatches('fill',same('fill')?n.fill:null)}</div>
        <div class="fld"><label>${L('테두리')}</label>${lineSwatches('stroke',same('stroke')?(n.stroke||s.stroke):null,'stroke',{none:true})}</div>
        <div class="fld"><label>${L('글자 색')}</label>${lineSwatches('ntext',same('textColor')?(n.textColor||null):null,'text',{white:true})}</div>
        <div class="row">${num('글자 크기','fontSize',n.fontSize||s.fontSize,'nodes',.5,6)}<div class="fld"><label>${L('스타일')}</label><div class="row"><button class="btn grow ${n.bold?'on':''}" data-action="bold"><b>B</b></button><button class="btn grow ${n.align==='left'?'on':''}" data-action="alignText" title="${L('왼쪽 정렬 (목록형 텍스트)')}">≡</button></div></div></div>
        ${onlyNodes.length===1?`<div class="row">${num('X','x',n.x,'nodes',s.grid)}${num('Y','y',n.y,'nodes',s.grid)}${num('W','w',n.w,'nodes',s.grid,20)}${num('H','h',n.h,'nodes',s.grid,20)}</div>`:''}
      </div>`;
    }
    const bands=nodes.filter(n=>n.type==='band');
    if(bands.length){const b=bands[0];html+=`<div class="sec"><h4>${L('단계 밴드')}</h4><div class="fld"><label>${L('라벨 (패널 문자 뒤에 공백 2칸: "a  Title")')}</label><input class="in text" data-prop="label" data-target="bands" value="${(b.label||'').replace(/"/g,'&quot;')}"></div><div class="fld"><label>${L('배경')}</label>${fillSwatches('bandfill',b.fill||s.bandFill)}</div><div class="row"><div class="fld"><label>${L('모서리')}</label><div class="seg">${[[0,'각'],[8,'8'],[16,'16'],[28,'28']].map(([v,l])=>`<button data-action="bradius" data-value="${v}" class="${(b.radius!=null?b.radius:(s.radius>0?6:0))===v?'on':''}">${L(l)}</button>`).join('')}</div></div><div class="fld"><label>${L('테두리')}</label><div class="seg">${[['none','없음'],['solid','실선'],['dashed','점선']].map(([v,l])=>`<button data-action="bborder" data-value="${v}" class="${(b.border||'none')===v?'on':''}">${L(l)}</button>`).join('')}</div></div></div>${bands.length===1?`<div class="row">${num('X','x',b.x,'bands',s.grid)}${num('Y','y',b.y,'bands',s.grid)}${num('W','w',b.w,'bands',s.grid,40)}${num('H','h',b.h,'bands',s.grid,40)}</div>`:''}<p class="note">${L('밴드를 옮기면 안에 있는 노드가 함께 이동합니다.')}</p></div>`;}
    const texts=nodes.filter(n=>n.type==='text');
    if(texts.length){const t=texts[0];html+=`<div class="sec"><h4>${L('텍스트')}</h4><div class="row">${num('글자 크기','fontSize',t.fontSize||s.fontSize,'texts',.5,6)}<div class="fld"><label>${L('굵게')}</label><button class="btn ${t.bold?'on':''}" data-action="tbold"><b>B</b></button></div></div><div class="fld"><label>${L('색')}</label>${lineSwatches('tcolor',t.color||s.textColor,'text',{white:true})}</div></div>`;}
    if(edges.length){
      const e=edges[0];const same=k=>edges.every(x=>x[k]===e[k]);
      html+=`<div class="sec"><h4>${L('연결선')} ${edges.length>1?`<span class="sub">${L('{n}개에 적용',{n:edges.length})}</span>`:''}</h4>
        <div class="fld"><label>${L('경로')}</label><div class="seg">${[['ortho','직각'],['straight','직선'],['curve','곡선']].map(([v,l])=>`<button data-action="route" data-value="${v}" class="${same('route')&&e.route===v?'on':''}">${L(l)}</button>`).join('')}</div></div>
        <div class="row"><div class="fld"><label>${L('시작')}</label><div class="seg">${[['none','—'],['arrow','◀'],['open','〈'],['dot','●']].map(([v,l])=>`<button data-action="startHead" data-value="${v}" class="${same('startHead')&&e.startHead===v?'on':''}">${l}</button>`).join('')}</div></div>
        <div class="fld"><label>${L('끝')}</label><div class="seg">${[['none','—'],['arrow','▶'],['open','〉'],['dot','●']].map(([v,l])=>`<button data-action="endHead" data-value="${v}" class="${same('endHead')&&e.endHead===v?'on':''}">${l}</button>`).join('')}</div></div></div>
        <div class="row"><div class="fld"><label>${L('라벨')}</label><input class="in text" data-prop="label" data-target="edges" value="${(e.label||'').replace(/"/g,'&quot;')}" placeholder="${L('예: Yes / No')}"></div>${num('굵기','strokeWidth',e.strokeWidth||s.strokeWidth,'edges',.1,.3)}</div>
        <div class="fld"><label>${L('색')}</label>${lineSwatches('estroke',same('stroke')?(e.stroke||s.stroke):null,'stroke')}</div>
        <div class="row"><button class="btn grow ${e.dash?'on':''}" data-action="dash">${L('점선')}</button><button class="btn grow" data-action="reverse">${L('방향 반전')}</button><button class="btn grow" data-action="resetBend" title="${L('꺾임 위치와 포트를 자동으로')}">${L('자동 경로')}</button></div>
        <div class="row"><div class="fld"><label>${L('길이 통일 (px)')}</label><input class="in" type="number" id="elen-in" value="${s.gap}" step="2" min="0"></div><label class="row" style="gap:4px;font-size:11.5px;color:var(--muted);align-self:flex-end;height:28px"><input type="checkbox" id="elen-straight" checked>${L('직선화')}</label><button class="btn" data-action="equalize" style="align-self:flex-end">${L('적용')}</button></div>
        <p class="note">${L('"길이 통일"은 각 연결선의 도착 노드를 출발 노드로부터 지정 거리에 다시 놓습니다. 직선화를 켜면 중심선도 맞춰 꺾임이 사라집니다.')}</p>
      </div>`;
    }
  }
  inspector.innerHTML=html;
}
inspector.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;const nodes=selectedNodes(),onlyNodes=nodes.filter(n=>n.type==='node'),edges=selectedEdges();
  const setAll=(list,fn)=>{mutate(()=>list.forEach(fn));renderInspector();};
  if(b.dataset.custom&&ev.shiftKey){if(b.dataset.custom==='img'){imageLib=imageLib.filter(i=>i.id!==v);saveImages();}else{const [cat,hex]=b.dataset.custom.split(':');customColors[cat]=(customColors[cat]||[]).filter(c=>c!==hex);saveColors();}renderInspector();return;}
  const popCat=()=>{const p=$('#color-pop');return p?p.dataset.cat:'fill';};
  switch(a){
    case 'addcolor':{const old=$('#color-pop');if(old)old.remove();b.closest('.sw').insertAdjacentHTML('afterend',colorPopHTML(b.dataset.cat||'fill'));$('#hex-in').focus();break;}
    case 'closepop':{const old=$('#color-pop');if(old)old.remove();break;}
    case 'pickcolor':addCustomColor(v,popCat());break;
    case 'addhex':{const hex=($('#hex-in').value||$('#color-in2').value).trim();if(/^#?[0-9a-f]{6}$/i.test(hex))addCustomColor(hex.startsWith('#')?hex:'#'+hex,popCat());else toast(L('#RRGGBB 형식으로 입력하세요'));break;}
    case 'ntext':setAll(onlyNodes,n=>{n.textColor=v;});break;
    case 'rmbg':{const targets=onlyNodes.filter(n=>n.shape==='image');if(!targets.length)break;toast(L('배경을 제거하는 중…'));Promise.all(targets.map(n=>removeBackground(n.srcOriginal||n.src,+v).then(out=>({n,out})))).then(list=>{mutate(()=>{for(const {n,out} of list){if(!n.srcOriginal)n.srcOriginal=n.src;n.src=out;}});renderInspector();toast(L('배경을 제거했습니다. 결과가 마음에 들지 않으면 다른 강도를 누르거나 "원본"으로 되돌리세요.'));}).catch(()=>toast(L('이 이미지는 처리할 수 없습니다 (SVG는 먼저 PNG로 변환해 주세요)')));break;}
    case 'restoreimg':setAll(onlyNodes.filter(n=>n.srcOriginal),n=>{n.src=n.srcOriginal;delete n.srcOriginal;});break;
    case 'libimg':{const n=onlyNodes.find(x=>x.shape==='image');if(!n)break;const img=new Image();img.onload=()=>{imageLib.push({id:uid(),name:(n.label||'image').split('\n')[0]+' ('+L('배경 제거')+')',src:n.src,w:img.naturalWidth||n.w,h:img.naturalHeight||n.h});saveImages();toast(L('라이브러리에 추가했습니다'));};img.src=n.src;break;}
    case 'uploadimg':$('#img-in').click();break;
    case 'placeimg':setTool('image:'+v);toast(L('캔버스를 클릭해 이미지를 배치하세요'));break;
    case 'imgmono':setAll(onlyNodes,n=>{n.mono=!onlyNodes[0].mono;});break;
    case 'imgframe':setAll(onlyNodes,n=>{n.frame=!onlyNodes[0].frame;});break;
    case 'bradius':setAll(nodes.filter(n=>n.type==='band'),n=>{n.radius=+v;});break;
    case 'bborder':setAll(nodes.filter(n=>n.type==='band'),n=>{n.border=v;});break;
    case 'preset':applyPreset(v);break;
    case 'style:stroke':mutate(()=>{state.style.stroke=v;state.style.textColor=v;});renderInspector();break;
    case 'delete':deleteSel();break;case 'duplicate':duplicateSel();break;case 'group':groupSel();break;case 'ungroup':ungroupSel();break;
    case 'align':alignSel(v);break;case 'dist':distribute(v,null);break;
    case 'gapx':distribute('x',+$('#gap-in').value||0);break;case 'gapy':distribute('y',+$('#gap-in').value||0);break;
    case 'match':matchSize(v);break;
    case 'shape':setAll(onlyNodes,n=>{n.shape=v;if(v==='diamond'&&n.h<56)n.h=64;});break;
    case 'fill':setAll(onlyNodes,n=>{n.fill=v;});break;
    case 'stroke':setAll(onlyNodes,n=>{n.stroke=v;});break;
    case 'bold':setAll(onlyNodes,n=>{n.bold=!onlyNodes[0].bold;});break;
    case 'alignText':setAll(onlyNodes,n=>{n.align=onlyNodes[0].align==='left'?'center':'left';});break;
    case 'bandfill':setAll(nodes.filter(n=>n.type==='band'),n=>{n.fill=v;});break;
    case 'tbold':setAll(nodes.filter(n=>n.type==='text'),n=>{n.bold=!n.bold;});break;
    case 'tcolor':setAll(nodes.filter(n=>n.type==='text'),n=>{n.color=v;});break;
    case 'route':setAll(edges,e=>{e.route=v;e.bend=null;});break;
    case 'startHead':setAll(edges,e=>{e.startHead=v;});break;case 'endHead':setAll(edges,e=>{e.endHead=v;});break;
    case 'estroke':setAll(edges,e=>{e.stroke=v;});break;
    case 'dash':setAll(edges,e=>{e.dash=!edges[0].dash;});break;
    case 'reverse':setAll(edges,e=>{const f=e.from;e.from=e.to;e.to=f;e.bend=null;});break;
    case 'resetBend':setAll(edges,e=>{e.bend=null;if(e.from.node)e.from.port='auto';if(e.to.node)e.to.port='auto';});break;
    case 'equalize':equalizeEdges(+$('#elen-in').value||0,$('#elen-straight').checked);break;
  }
});
inspector.addEventListener('input',ev=>{
  const i=ev.target;if(!i.dataset.prop)return;const prop=i.dataset.prop,tgt=i.dataset.target;let v=i.value;if(i.dataset.type==='number'){if(v==='')return;v=+v;if(Number.isNaN(v))return;}
  const key=tgt+':'+prop;if(inputSession!==key){snapshot();inputSession=key;}
  if(tgt==='style')state.style[prop]=v;else if(tgt==='page')state.page[prop]=Math.max(200,v);
  else{const list=tgt==='nodes'?selectedNodes().filter(n=>n.type==='node'):tgt==='bands'?selectedNodes().filter(n=>n.type==='band'):tgt==='texts'?selectedNodes().filter(n=>n.type==='text'):selectedEdges();list.forEach(e=>{e[prop]=v;});}
  renderCanvas();
});
inspector.addEventListener('change',ev=>{if(ev.target.dataset.prop){inputSession=null;persist();if(ev.target.tagName==='SELECT')renderInspector();}});

/* ---------- menus / export ---------- */
function closeMenus(){$$('.menu .dd').forEach(d=>d.hidden=true);}
$$('[data-menu]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();const dd=b.nextElementSibling;const open=!dd.hidden;closeMenus();dd.hidden=open;}));
document.addEventListener('click',ev=>{if(!ev.target.closest('.menu'))closeMenus();});
$$('.dd [data-act]').forEach(b=>b.addEventListener('click',()=>{closeMenus();const a=b.dataset.act;
  if(a.startsWith('mm:')){mmLoadDoc(MM_EXAMPLES[a.slice(3)](),true);return;}
  if(mode==='mindmap'&&a.startsWith('export:')){mmExportSVG().then(x=>{if(a==='export:svg')download(new Blob([x.svg],{type:'image/svg+xml'}),'mindmap.svg');else if(a==='export:png')exportPNG(x.svg,x.w,x.h,'mindmap.png');else if(a==='export:json')download(new Blob([mmSer()],{type:'application/json'}),'mindmap.json');else navigator.clipboard.writeText(x.svg).then(()=>toast(L('SVG 코드를 클립보드에 복사했습니다. Illustrator/Inkscape/PowerPoint에 붙여넣거나 .svg로 저장하세요.'))).catch(()=>toast(L('클립보드 접근이 차단되었습니다.')));});return;}
  if(a==='new'){if(state.elements.length&&!confirm(L('현재 문서를 지우고 새로 시작할까요? (실행 취소 불가)')))return;state=newDoc();sel.clear();history=[];future=[];renderAll();fitPage();persist();}
  else if(a==='import')$('#file-in').click();
  else if(a.startsWith('tpl:')){if(state.elements.length&&!confirm(L('현재 문서를 예제로 바꿀까요?')))return;loadTemplate(a.slice(4));}
  else if(a==='export:svg')download(new Blob([buildExportSVG()],{type:'image/svg+xml'}),'figure.svg');
  else if(a==='export:png')exportPNG();
  else if(a==='export:json')download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'figure.json');

/* ---------- keyboard ---------- */
window.addEventListener('keydown',ev=>{
  if(mode==='mindmap'){mmKeydown(ev);return;}
  if(editing){if(editing.tools&&editing.tools.contains(ev.target))return;if(!editing.ta.contains(ev.target)){editing.ta.focus();if(ev.key==='Escape'){endEdit();}else if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();commitEdit();}}return;}
  const tag=(ev.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  const k=ev.key.toLowerCase();const mod=ev.ctrlKey||ev.metaKey;
  if(k===' '){if(!spaceDown){spaceDown=true;stage.classList.add('tool-hand');}ev.preventDefault();return;}
  if(mod&&k==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){ev.preventDefault();redo();return;}
  if(mod&&k==='a'){ev.preventDefault();selectAll();return;}
  if(mod&&k==='d'){ev.preventDefault();duplicateSel();return;}
  if(mod&&k==='c'){if(copySel())ev.preventDefault();return;}
  if(mod&&k==='v'){if(pasteClip())ev.preventDefault();return;}
  if(mod&&k==='g'){ev.preventDefault();ev.shiftKey?ungroupSel():groupSel();return;}
  // 방향키: 그리드 단위 이동, Shift는 크기 조절(→ ↑ 키움, ← ↓ 줄임, 파워포인트와 같은 방향), Ctrl은 1px 단위
  if(k.startsWith('arrow')){ev.preventDefault();const g=mod?1:st().grid,dx=k==='arrowleft'?-g:k==='arrowright'?g:0,dy=k==='arrowup'?-g:k==='arrowdown'?g:0;ev.shiftKey?resizeSel(dx,-dy):nudge(dx,dy);return;}
  if(mod)return;
  if(k==='delete'||k==='backspace'){ev.preventDefault();deleteSel();return;}
  if(k==='escape'){sel.clear();connectSrc=null;sketch=null;hideSketchPop();setTool('select');renderAll();return;}
  if(k==='enter'&&sel.size===1){ev.preventDefault();startEdit([...sel][0]);return;}
  const map={v:'select',h:'hand',r:'shape:rounded',d:'shape:diamond',t:'text',c:'connect',p:'pen'};if(map[k])setTool(map[k]);
});
window.addEventListener('keyup',ev=>{if(ev.key===' '){spaceDown=false;if(tool!=='hand')stage.classList.remove('tool-hand');}});

/* ---------- embed API (window.WorkflowAssist + postMessage) ---------- */
const listeners={};
function emit(ev,data){(listeners[ev]||[]).forEach(f=>{try{f(data);}catch(e){}});if(window.parent!==window){try{window.parent.postMessage(Object.assign({source:'workflow-assist',type:ev},data||{}),'*');}catch(e){}}}
function loadDoc(doc){if(!doc||!Array.isArray(doc.elements)||!Array.isArray(doc.edges))throw new Error('invalid document: elements[] and edges[] are required');snapshot();state=Object.assign(newDoc(),JSON.parse(JSON.stringify(doc)));state.style=Object.assign(defaultStyle(),doc.style||{});sel.clear();renderAll();fitPage();persist();}
window.WorkflowAssist={
  version:'1.2.0',
  load:loadDoc,
  getDoc(){return JSON.parse(JSON.stringify(state));},
  exportSVG(){return buildExportSVG();},
  loadTemplate(id){if(!TEMPLATES[id])throw new Error('unknown template: '+id);loadTemplate(id);},
  templates(){return Object.keys(TEMPLATES);},
  newDocument(){state=newDoc();sel.clear();history=[];future=[];renderAll();fitPage();persist();},
  on(ev,fn){(listeners[ev]=listeners[ev]||[]).push(fn);return ()=>{listeners[ev]=(listeners[ev]||[]).filter(f=>f!==fn);};}
};
window.addEventListener('message',ev=>{
  const m=ev.data;if(!m||m.target!=='workflow-assist')return;
  const reply=(type,data)=>{try{ev.source.postMessage(Object.assign({source:'workflow-assist',type,requestId:m.requestId},data||{}),ev.origin||'*');}catch(e){}};
  try{
    switch(m.type){
      case 'load':loadDoc(m.doc);reply('loaded');break;
      case 'getDoc':reply('doc',{doc:window.WorkflowAssist.getDoc()});break;
      case 'exportSVG':reply('svg',{svg:buildExportSVG()});break;
      case 'loadTemplate':window.WorkflowAssist.loadTemplate(m.id);reply('loaded');break;
      case 'newDocument':window.WorkflowAssist.newDocument();reply('loaded');break;
      case 'templates':reply('templates',{templates:Object.keys(TEMPLATES)});break;
      default:reply('error',{message:'unknown message type: '+m.type});
    }
  }catch(e){reply('error',{message:String((e&&e.message)||e)});}
});
