<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow-assist Manual</title>
<script>
// 저장된 선택 → 브라우저 언어 → 영어 순으로 해당 설명서로 이동. ?choose 를 붙이면 이동하지 않고 선택 화면을 보여 준다.
(function(){
  if(/[?&]choose\b/.test(location.search))return;
  var pick=null;
  try{pick=localStorage.getItem('workflow-assist.manual-lang');}catch(e){}
  if(!/^(en|kr|jp|cn)$/.test(pick||'')){
    var langs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
    pick='en';
    for(var i=0;i<langs.length;i++){var l=String(langs[i]).toLowerCase();
      if(l.indexOf('ko')===0){pick='kr';break;}if(l.indexOf('ja')===0){pick='jp';break;}if(l.indexOf('zh')===0){pick='cn';break;}if(l.indexOf('en')===0){pick='en';break;}}
  }
  location.replace('manual_'+pick+'.html'+location.hash);
})();
</script>
<style>
:root{--bg:#F5F6F8;--surface:#FFFFFF;--line:#D8DCE4;--ink:#1B1F27;--muted:#5F6B7C;--accent:#2F5FA8;--accent-soft:#E2EBF9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181D;--surface:#1E2228;--line:#333944;--ink:#E6E8EC;--muted:#9AA3B2;--accent:#7BA3E3;--accent-soft:#26364F}}
:root[data-theme="dark"]{--bg:#15181D;--surface:#1E2228;--line:#333944;--ink:#E6E8EC;--muted:#9AA3B2;--accent:#7BA3E3;--accent-soft:#26364F}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI","Noto Sans KR","Noto Sans JP","Noto Sans SC",sans-serif;padding:24px 16px}
.box{width:100%;max-width:420px;text-align:center}
h1{font-size:22px;margin:0 0 6px}
p{color:var(--muted);margin:0 0 22px;font-size:14px}
.list{display:grid;gap:8px}
.list a{display:block;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:15px}
.list a:hover{border-color:var(--accent);background:var(--accent-soft)}
.back{display:inline-block;margin-top:22px;color:var(--accent);text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="box">
  <h1>Workflow-assist Manual</h1>
  <p>Choose a language · 언어 선택 · 言語を選択 · 选择语言</p>
  <div class="list">
    <a href="manual_en.html" hreflang="en">English</a>
    <a href="manual_kr.html" hreflang="ko">한국어</a>
    <a href="manual_jp.html" hreflang="ja">日本語</a>
    <a href="manual_cn.html" hreflang="zh-CN">中文（简体）</a>
  </div>
  <a class="back" href="index.html">← Workflow-assist</a>
</div>
</body>
</html>
